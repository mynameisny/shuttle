<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班车时刻 · 班车调度管理</title>
    <meta name="nav" content="passenger.schedule">
    <meta name="desc" content="查询某天某线路的班车时刻">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/app.css">
    <script>try{if(localStorage.getItem('shuttle.sidebar.collapsed')==='1')document.documentElement.classList.add('sb-collapsed');}catch(e){}</script>
    <style>
        .mono { font-variant-numeric: tabular-nums; }
        .dir-tag {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 34px; height: 20px; padding: 0 8px; border-radius: 10px;
            font-size: 11px; font-weight: 600;
        }
        .dir-out { background: var(--c-info-soft, #e7f1ff); color: var(--c-info, #1971c2); }
        .dir-in { background: #f3ecff; color: #7048e8; }
        .trip-card {
            border: 1px solid var(--c-border, #eef1f4); border-radius: var(--radius-md, 10px);
            padding: 14px 16px; margin-bottom: 10px;
            cursor: pointer; transition: border-color .15s, box-shadow .15s;
        }
        .trip-card:hover { border-color: var(--c-primary, #1971c2); }
        .trip-card.selected { border-color: var(--c-primary, #1971c2); box-shadow: 0 0 0 3px rgba(25,113,194,.12); }
        .tc-span { font-size: 20px; font-weight: 600; margin-top: 2px; }
        /* 班次横向排列：去程左、返程右，平均分 */
        .trip-row { display: flex; gap: 12px; align-items: stretch; }
        .trip-row .trip-card { flex: 1; min-width: 0; margin-bottom: 0; }
        /* 描线地图 */
        #scheduleMap {
            height: 340px; margin-top: 16px; border-radius: 10px; overflow: hidden;
            border: 1px solid var(--c-border, #eef1f4);
        }
        .trip-card .tc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .trip-card .tc-name { font-weight: 600; font-size: 14px; }
        .trip-card .tc-hs { color: var(--c-text-3, #868e96); font-size: 12.5px; margin-left: 2px; }
        .tc-route { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .tc-time { font-size: 20px; font-weight: 600; }
        .tc-stop { color: var(--c-text-2, #495057); font-size: 13px; }
        .tc-arrow { color: var(--c-text-3, #adb5bd); }
        .tc-note { color: var(--c-text-3, #868e96); font-size: 12px; margin-top: 6px; }
        /* 站点时间线 */
        .tc-count { margin-left: auto; font-size: 12px; color: var(--c-text-3, #868e96); flex-shrink: 0; }
        .stops-timeline { padding: 4px 0 0; }
        .stop-row {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 0; position: relative;
        }
        .stop-row:not(:last-child)::before {
            content: ''; position: absolute; left: 59px; top: 22px; bottom: -8px;
            width: 2px; background: var(--c-border, #e9ecef);
        }
        .stop-times { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; min-width: 46px; }
        .st-main { font-size: 13px; font-weight: 600; }
        .st-line { font-size: 12px; }
        .st-line i { font-style: normal; font-size: 10px; color: var(--c-text-3, #868e96); margin-right: 3px; }
        .approx-tag { font-size: 10px; padding: 1px 5px; border-radius: 6px; background: #f1f3f5; color: var(--c-text-3, #868e96); flex-shrink: 0; }
        .stop-dot {
            width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
            background: var(--c-text-3, #adb5bd); position: relative; z-index: 1;
        }
        .stop-dot-first { background: var(--c-info, #1971c2); }
        .stop-dot-last { background: #e8590c; }
        .stop-name { font-size: 13px; flex: 1; }
        .stop-clickable { cursor: pointer; border-radius: 6px; }
        .stop-clickable:hover { background: #f6f8fa; }
        .stop-clickable:hover .stop-name { color: #1971c2; }
        .stop-tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; flex-shrink: 0; }
        .stop-tag-first { background: #e7f1ff; color: #1971c2; }
        .stop-tag-last { background: #fff0e0; color: #e8590c; }
        .no-service {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            padding: 40px 0; color: var(--c-text-2, #495057);
        }
        .no-service .ico { width: 40px; height: 40px; color: var(--c-text-3, #adb5bd); }
        .result-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .result-head .rh-title { font-size: 14px; font-weight: 600; }
        .result-head .rh-count { color: var(--c-text-3, #868e96); font-size: 12.5px; }
        /* 当班信息 */
        .crew-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .crew-item {
            flex: 1; min-width: 150px;
            border: 1px solid var(--c-border, #eef1f4); border-radius: 10px; padding: 12px 14px;
        }
        .crew-item .ci-label { font-size: 11px; color: var(--c-text-3, #868e96); margin-bottom: 4px; }
        .crew-item .ci-value { font-size: 15px; font-weight: 600; }
        .crew-item .ci-sub { font-size: 12px; color: var(--c-text-3, #868e96); margin-top: 2px; }
        .crew-empty { color: var(--c-text-3, #adb5bd); }
        .crew-vehicle { background: #eaf2fd; border-color: #bcd6f3; }
        .crew-vehicle .ci-label { color: #185fa5; }
        .crew-driver { background: #e9f7ef; border-color: #b8e0c8; }
        .crew-driver .ci-label { color: #2b8a3e; }
        .crew-captain { background: #f2ecfd; border-color: #d4c4f5; }
        .crew-captain .ci-label { color: #7048e8; }
        /* 带颜色的线路下拉 */
        .route-select { position: relative; }
        .route-select-btn {
            display: flex; align-items: center; gap: 8px; width: 100%;
            height: 38px; padding: 0 12px;
            border: 1px solid var(--c-border-strong, #d5dae0); border-radius: 8px;
            background: #fff; cursor: pointer; font-size: 13px; color: var(--c-text-1, #212529);
        }
        .route-select-btn:focus { outline: none; border-color: var(--c-primary); }
        .rs-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
        .rs-text { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rs-arrow { width: 14px; height: 14px; color: var(--c-text-3, #adb5bd); flex-shrink: 0; transition: transform .15s; }
        .route-select.open .rs-arrow { transform: rotate(180deg); }
        .route-select-panel {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 30;
            margin-top: 4px; max-height: 300px; overflow-y: auto;
            border: 1px solid var(--c-border, #eef1f4); border-radius: 8px;
            background: #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.10);
        }
        .rs-option {
            display: flex; align-items: center; gap: 8px; padding: 8px 12px;
            cursor: pointer; font-size: 13px; color: var(--c-text-1, #212529);
        }
        .rs-option:hover { background: #f6f8fa; }
        .rs-option .rs-dot { width: 10px; height: 10px; }
        /* 头像与照片 */
        .ci-avatar {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            cursor: pointer; flex-shrink: 0; display: block;
            border: 1px solid var(--c-border, #eef1f4);
        }
        .ci-avatar-empty {
            display: flex; align-items: center; justify-content: center;
            background: #f1f3f5; color: var(--c-text-3, #adb5bd);
            font-size: 16px; font-weight: 600; cursor: default;
        }
        /* 头像右下角性别角标：男=蓝(箭头)、女=粉(圆圈) */
        .ci-avatar-wrap { position: relative; display: inline-flex; flex-shrink: 0; }
        .ci-gender-badge {
            position: absolute;
            right: -2px; bottom: -2px;
            width: 18px; height: 18px;
            border-radius: 50%;
            border: 2px solid #fff;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .ci-gender-badge svg {
            width: 10px; height: 10px;
            fill: none; stroke: currentColor;
            stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
        }
        .ci-gender-m { background: var(--c-info-soft, #e7f1ff); color: var(--c-info, #1971c2); }
        .ci-gender-f { background: #fdeef4; color: #d63384; }
        .ci-bus {
            width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
            object-fit: contain; cursor: pointer; display: block;
            background: #fff; border: 1px solid var(--c-border, #eef1f4); padding: 2px;
        }
        .crew-item .ci-head { display: flex; align-items: center; gap: 10px; }
        .crew-item .ci-info { flex: 1; min-width: 0; }
        .ci-photos-btn { margin-top: 8px; }
        /* lightbox */
        .lightbox {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999;
            background: rgba(0,0,0,0.82); display: flex; align-items: center; justify-content: center;
        }
        .lightbox img { max-width: 90%; max-height: 85%; border-radius: 8px; }
        .lb-btn {
            position: absolute; background: rgba(255,255,255,0.15); color: #fff; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .lb-btn:hover { background: rgba(255,255,255,0.3); }
        .lb-prev { left: 20px; top: 50%; transform: translateY(-50%); }
        .lb-next { right: 20px; top: 50%; transform: translateY(-50%); }
        .lb-close { top: 20px; right: 20px; }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page">

            <div class="page-head">
                <div>
                    <div class="crumbs" data-auto-crumbs></div>
                </div>
            </div>

            <div class="card">
                <div class="card-body" style="display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap">
                    <div class="field" style="margin:0">
                        <label>日期<span class="req">*</span></label>
                        <input type="date" class="input" id="fDate" style="width:160px">
                    </div>
                    <div class="field" style="margin:0; flex:1; min-width:240px">
                        <label>线路<span class="req">*</span></label>
                        <div class="route-select" id="routeSelect">
                            <button type="button" class="route-select-btn" id="routeSelectBtn">
                                <span class="rs-dot" id="rsDot" style="background:#9aa3b0"></span>
                                <span class="rs-text" id="rsText">请选择线路</span>
                                <svg class="rs-arrow" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8l4 4 4-4"/></svg>
                            </button>
                            <div class="route-select-panel" id="routeSelectPanel" style="display:none"></div>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="btnQuery" style="margin-bottom:2px">
                        <svg class="ico" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.4"/><path d="M13 13l3.4 3.4"/></svg>
                        查询
                    </button>
                </div>
            </div>

            <div class="card" id="resultCard" style="display:none; margin-top:16px">
                <div class="card-body">
                    <div class="result-head" id="resultHead"></div>
                    <div id="result"></div>
                    <div id="scheduleMap" style="display:none"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="toast"></div>
<div id="lightbox" class="lightbox" style="display:none">
    <button class="lb-btn lb-prev" id="lbPrev" type="button">‹</button>
    <img id="lbImg" src="" alt="">
    <button class="lb-btn lb-next" id="lbNext" type="button">›</button>
    <button class="lb-btn lb-close" id="lbClose" type="button">×</button>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    initShell();

    let routes = [];
    let selectedRoutePk = null;
    let lastTrips = [];
    let lastDate = '';
    let lastAssignment = null;
    let selectedTripId = null;

    function today() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function fmt(t) {
        return t ? String(t).slice(0, 5) : '—';
    }

    function weekdayCn(date) {
        return ['日', '一', '二', '三', '四', '五', '六'][new Date(date + 'T00:00:00').getDay()];
    }

    function routeColor(r) {
        return r && r.routeColor ? '#' + String(r.routeColor).replace('#', '') : '#9aa3b0';
    }

    function routeDisplayName(r) {
        return r ? (r.routeLongName || r.routeShortName || r.routeId) : '';
    }

    async function loadRoutes() {
        try {
            routes = await api('/api/routes') || [];
            $('routeSelectPanel').innerHTML = routes.map(r =>
                '<div class="rs-option" data-id="' + r.id + '">' +
                '<span class="rs-dot" style="background:' + esc(routeColor(r)) + '"></span>' +
                '<span>' + esc(routeDisplayName(r)) + '</span>' +
                '</div>').join('');
            $('routeSelectPanel').querySelectorAll('.rs-option').forEach(o =>
                o.addEventListener('click', () => selectRoute(o.dataset.id)));
        } catch (err) { toast('加载线路失败：' + err.message, true); }
    }

    function selectRoute(id) {
        selectedRoutePk = id;
        const r = routes.find(x => String(x.id) === String(id));
        $('rsDot').style.background = routeColor(r);
        $('rsText').textContent = routeDisplayName(r) || '请选择线路';
        closePanel();
        query();
    }

    function togglePanel() {
        const p = $('routeSelectPanel');
        const open = p.style.display !== 'none';
        p.style.display = open ? 'none' : '';
        $('routeSelect').classList.toggle('open', !open);
    }

    function closePanel() {
        $('routeSelectPanel').style.display = 'none';
        $('routeSelect').classList.remove('open');
    }

    async function query() {
        const routePk = selectedRoutePk;
        const date = $('fDate').value;
        if (!routePk) { toast('请选择线路', true); return; }
        if (!date) { toast('请选择日期', true); return; }
        try {
            const [trips, assignment] = await Promise.all([
                api('/api/trips/active-on/' + date + '?routePk=' + routePk),
                api('/api/assignments/route/' + routePk).catch(() => null)
            ]);
            lastTrips = trips || [];
            lastDate = date;
            lastAssignment = assignment;
            selectedTripId = null; // 每次查询重置班次选中
            render(routePk, date, lastTrips, assignment);
        } catch (err) { toast('查询失败：' + err.message, true); }
    }

    function render(routePk, date, trips, assignment) {
        const route = routes.find(r => String(r.id) === String(routePk));
        const lineName = route ? (route.routeLongName || route.routeShortName || route.routeId) : '';
        const head = $('resultHead');
        head.innerHTML = '<span class="rh-title">' + esc(lineName) + '</span>' +
            '<span class="rh-count mono">' + date + ' · 星期' + weekdayCn(date) + '</span>';

        const box = $('result');
        if (!trips.length) {
            box.innerHTML = '<div class="no-service">' +
                '<svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
                '<circle cx="10" cy="10" r="7"/><path d="M6 10h8"/></svg>' +
                '<div style="font-size:15px;font-weight:600">当天停运</div>' +
                '<div style="font-size:12.5px;color:var(--c-text-3)">该线路在 ' + date + ' 无运营班次（法定假日或非运营日）</div>' +
                '</div>';
            $('resultCard').style.display = '';
            return;
        }
        // 班次按方向排序：去程(0)在前、返程(1)在后，横向平均排布
        const sorted = trips.slice().sort((a, b) => (a.directionId || 0) - (b.directionId || 0));
        box.innerHTML = renderCrew(assignment) + '<div class="trip-row">' + sorted.map(t => {
            // 后端 stopTimes 未排序（Trip.stopTimes 无 @OrderBy，JPA 按主键 id 返回），这里按 stop_sequence 排序
            const st = (t.stopTimes || []).slice().sort((a, b) => (a.stopSequence || 0) - (b.stopSequence || 0));
            const dir = t.directionId === 1;
            const dirTag = dir
                ? '<span class="dir-tag dir-in">返程</span>'
                : '<span class="dir-tag dir-out">去程</span>';
            const stopRows = st.map((s, idx) => {
                const name = s.stop ? s.stop.stopName : '未命名站';
                const desc = s.stop ? s.stop.stopDesc : '';
                const lat = s.stop ? s.stop.stopLat : null;
                const lng = s.stop ? s.stop.stopLon : null;
                const hasCoord = parseLatLng(lat, lng) != null;
                const coordAttr = hasCoord
                    ? ' data-lat="' + lat + '" data-lng="' + lng + '" data-name="' + esc(name) + '" data-desc="' + esc(desc) + '"'
                    : '';
                const isFirst = idx === 0;
                const isLast = idx === st.length - 1;
                const dotCls = isFirst ? ' stop-dot-first' : (isLast ? ' stop-dot-last' : '');
                const tag = isFirst ? '<span class="stop-tag stop-tag-first">发车</span>'
                          : (isLast ? '<span class="stop-tag stop-tag-last">到达</span>' : '');
                const approx = !isFirst && !isLast && s.timepoint === 'APPROXIMATE';
                const approxTag = approx ? '<span class="approx-tag">约</span>' : '';
                let times;
                if (isFirst) {
                    times = '<span class="stop-times"><span class="st-main mono">' + fmt(s.departureTime || s.arrivalTime) + '</span></span>';
                } else if (isLast) {
                    times = '<span class="stop-times"><span class="st-main mono">' + fmt(s.arrivalTime || s.departureTime) + '</span></span>';
                } else if (s.arrivalTime && s.departureTime && s.arrivalTime !== s.departureTime) {
                    times = '<span class="stop-times">' +
                        '<span class="st-line"><i>到</i><span class="mono">' + fmt(s.arrivalTime) + '</span></span>' +
                        '<span class="st-line"><i>发</i><span class="mono">' + fmt(s.departureTime) + '</span></span>' +
                        '</span>';
                } else {
                    times = '<span class="stop-times"><span class="st-main mono">' + fmt(s.arrivalTime || s.departureTime) + '</span></span>';
                }
                return '<div class="stop-row' + (hasCoord ? ' stop-clickable' : '') + '"' + coordAttr + '>' +
                    times +
                    '<span class="stop-dot' + dotCls + '"></span>' +
                    '<span class="stop-name">' + esc(name) + '</span>' +
                    approxTag +
                    tag + '</div>';
            }).join('');
            const isSelected = selectedTripId === t.tripId;
            return '<div class="trip-card' + (isSelected ? ' selected' : '') + '" data-trip="' + esc(t.tripId) + '">' +
                '<div class="tc-head">' + dirTag +
                '<span class="tc-name">' + esc(t.tripShortName || t.tripId) + '</span>' +
                '<span class="tc-hs">' + (t.tripHeadsign ? '→ ' + esc(t.tripHeadsign) : '') + '</span>' +
                '<span class="tc-count mono">' + st.length + ' 站</span>' +
                '</div>' +
                '<div class="stops-timeline">' + stopRows + '</div>' +
                '</div>';
        }).join('') + '</div>';
        $('resultCard').style.display = '';
        // 地图：默认隐藏，选中班次后才显示该班次的描线
        const sel = selectedTripId ? sorted.find(t => t.tripId === selectedTripId) : null;
        if (sel) drawMap([sel]);
        else clearMap();
    }

    // ---------- 描线地图 ----------
    let schedMap = null;
    let schedShapeLayers = [];

    async function drawMap(trips) {
        const el = $('scheduleMap');
        if (!el) return;
        el.style.display = '';
        if (!schedMap) {
            schedMap = createMap('scheduleMap');
        }
        const map = schedMap.map;
        // 清除上一轮的轨迹线
        schedShapeLayers.forEach(l => map.removeLayer(l));
        schedShapeLayers = [];

        const bounds = [];
        for (const t of trips) {
            if (!t.shapeId) continue;
            try {
                const points = await api('/api/shapes/' + encodeURIComponent(t.shapeId));
                if (!points || !points.length) continue;
                const latlngs = points
                    .map(p => parseLatLng(p.shapePtLat, p.shapePtLon))
                    .filter(Boolean);
                if (latlngs.length < 2) continue;
                const color = t.directionId === 1 ? '#7048e8' : '#1971c2'; // 返程紫、去程蓝
                const line = L.polyline(latlngs, { color, weight: 4, opacity: .85 }).addTo(map);
                schedShapeLayers.push(line);
                bounds.push(latlngs[0], latlngs[latlngs.length - 1]);
            } catch (e) { /* 无轨迹忽略 */ }
        }
        if (bounds.length) map.fitBounds(bounds, { padding: [24, 24] });
        // 容器刚从 display:none 变为可见，需重新计算尺寸
        setTimeout(() => map.invalidateSize(), 100);
    }

    function clearMap() {
        const el = $('scheduleMap');
        if (!el) return;
        el.style.display = 'none';
        if (schedMap) {
            schedShapeLayers.forEach(l => schedMap.map.removeLayer(l));
            schedShapeLayers = [];
            if (focusMarker) { schedMap.map.removeLayer(focusMarker); focusMarker = null; }
        }
    }

    // ---------- 站点定位：点击站点 → 地图跳转 + 悬浮显示站名/坐标 ----------
    let focusMarker = null;
    function focusStop(lat, lng, name, desc) {
        const ll = parseLatLng(lat, lng);
        if (!ll || !schedMap) return;
        const map = schedMap.map;
        map.flyTo(ll, Math.max(map.getZoom(), 14));
        if (focusMarker) map.removeLayer(focusMarker);
        let html = '<b>' + esc(name || '站点') + '</b><br><span class="mono">' +
            ll[0].toFixed(5) + ', ' + ll[1].toFixed(5) + '</span>';
        if (desc) html += '<br><span style="color:var(--c-text-3)">' + esc(desc) + '</span>';
        focusMarker = L.marker(ll).addTo(map).bindPopup(html).openPopup();
    }

    const GENDER_SVG = {
        male: '<svg viewBox="0 0 24 24"><circle cx="10" cy="14" r="5.5"/><path d="M14.5 9.5L19 5M19 5h-4M19 5v4"/></svg>',
        female: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5.5"/><path d="M12 13.5V20M9 17h6"/></svg>'
    };

    function genderBadge(g) {
        if (g === '男') return '<span class="ci-gender-badge ci-gender-m" title="男">' + GENDER_SVG.male + '</span>';
        if (g === '女') return '<span class="ci-gender-badge ci-gender-f" title="女">' + GENDER_SVG.female + '</span>';
        return '';
    }

    function avatarHtml(url, name, gender) {
        const badge = genderBadge(gender);
        if (url) {
            return '<span class="ci-avatar-wrap">' +
                '<img class="ci-avatar" src="' + esc(url) + '" alt="' + esc(name || '') + '" data-full="' + esc(url) + '">' +
                badge + '</span>';
        }
        return '<span class="ci-avatar-wrap">' +
            '<img class="ci-avatar" src="/img/user.png" alt="' + esc(name || '') + '" title="未设置头像">' +
            badge + '</span>';
    }

    function vehicleThumb(a) {
        const photos = (a.vehiclePhotos || '').split(',').map(s => s.trim()).filter(Boolean);
        const title = photos.length ? '查看照片（' + photos.length + '）' : '暂无照片';
        const attr = photos.length ? ' data-photos="' + esc(a.vehiclePhotos) + '"' : '';
        return '<img class="ci-bus" src="/img/transport.png" alt="班车" title="' + title + '"' + attr + '>';
    }

    function renderCrew(a) {
        if (!a) return '';
        const sub = [a.vehicleType, a.seatCount != null ? a.seatCount + '座' : null].filter(Boolean).join(' · ');
        return '<div class="crew-grid">' +
            '<div class="crew-item crew-vehicle"><div class="ci-label">班车</div>' +
            '<div class="ci-head">' + vehicleThumb(a) +
            '<div class="ci-info"><div class="ci-value">' + esc(a.vehiclePlate || '—') + '</div>' +
            (sub ? '<div class="ci-sub">' + esc(sub) + '</div>' : '') + '</div></div>' +
            '</div>' +
            '<div class="crew-item crew-driver"><div class="ci-label">司机</div>' +
            '<div class="ci-head">' + avatarHtml(a.driverAvatar, a.driverName, a.driverGender) +
            '<div class="ci-info"><div class="ci-value">' + esc(a.driverName || '—') + '</div>' +
            (a.driverPhone ? '<div class="ci-sub">' + esc(a.driverPhone) + '</div>' : '') + '</div></div>' +
            '</div>' +
            '<div class="crew-item crew-captain"><div class="ci-label">车长</div>' +
            '<div class="ci-head">' + avatarHtml(a.captainAvatar, a.captainName, a.captainGender) +
            '<div class="ci-info"><div class="ci-value">' + (a.captainName ? esc(a.captainName) : '<span class="crew-empty">未配置</span>') + '</div>' +
            (a.captainPhone ? '<div class="ci-sub">' + esc(a.captainPhone) + '</div>' : '') + '</div></div>' +
            '</div>' +
            '</div>';
    }

    // ---------- lightbox ----------
    let lbImages = [];
    let lbIndex = 0;

    function openLightbox(images, index) {
        lbImages = (images || []).filter(Boolean);
        if (!lbImages.length) return;
        lbIndex = index || 0;
        renderLb();
        $('lightbox').style.display = '';
    }

    function renderLb() {
        $('lbImg').src = lbImages[lbIndex];
        $('lbPrev').style.display = lbImages.length > 1 ? '' : 'none';
        $('lbNext').style.display = lbImages.length > 1 ? '' : 'none';
    }

    function closeLightbox() { $('lightbox').style.display = 'none'; }

    $('btnQuery').addEventListener('click', query);
    // 切换日期后自动按新日期重新查询（已选线路时）；未选线路则等选线时再查
    $('fDate').addEventListener('change', () => { if (selectedRoutePk) query(); });
    $('routeSelectBtn').addEventListener('click', togglePanel);
    document.addEventListener('click', e => {
        const sel = $('routeSelect');
        if (sel && !sel.contains(e.target)) closePanel();
    });

    // lightbox 事件
    $('lbPrev').addEventListener('click', () => { lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length; renderLb(); });
    $('lbNext').addEventListener('click', () => { lbIndex = (lbIndex + 1) % lbImages.length; renderLb(); });
    $('lbClose').addEventListener('click', closeLightbox);
    $('lightbox').addEventListener('click', e => { if (e.target === $('lightbox')) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('lightbox').style.display !== 'none') closeLightbox(); });

    // result 内头像 / 车辆照片点击（事件委托）
    $('result').addEventListener('click', e => {
        const avatar = e.target.closest('.ci-avatar');
        if (avatar && avatar.dataset.full) { openLightbox([avatar.dataset.full], 0); return; }
        const btn = e.target.closest('[data-photos]');
        if (btn) {
            const photos = (btn.dataset.photos || '').split(',').map(s => s.trim()).filter(Boolean);
            openLightbox(photos, 0);
            return;
        }
        const row = e.target.closest('.stop-row');
        if (row && row.dataset.lat) {
            focusStop(row.dataset.lat, row.dataset.lng, row.dataset.name, row.dataset.desc);
            return;
        }
        const card = e.target.closest('.trip-card[data-trip]');
        if (card) {
            const tripId = card.dataset.trip;
            selectedTripId = (selectedTripId === tripId) ? null : tripId;
            render(selectedRoutePk, lastDate, lastTrips, lastAssignment);
        }
    });

    (async () => {
        $('fDate').value = today();
        await loadRoutes();
        // 支持 URL 深链：?routePk=1&date=2026-11-17 自动查询（便于分享某线路时刻表）
        const params = new URLSearchParams(location.search);
        const routePk = params.get('routePk');
        const date = params.get('date');
        if (routePk) {
            if (date) $('fDate').value = date;
            selectRoute(routePk);
        }
    })();
</script>
</body>
</html>
