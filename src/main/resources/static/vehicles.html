<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆档案 · 班车调度管理</title>
    <meta name="nav" content="vehicles.archives">
    <link rel="stylesheet" href="css/app.css">
    <style>
        /* 页面特异性样式：仅车辆页使用的部分 */
        .fleet-summary {
            display: flex;
            align-items: center;
            gap: 0;
            padding: 0 18px;
            border-bottom: 1px solid var(--c-border);
            overflow-x: auto;
        }
        .fleet-summary .fs-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 12px 20px 12px 0;
            margin-right: 20px;
            border-right: 1px solid #f1f3f6;
            white-space: nowrap;
        }
        .fleet-summary .fs-item:last-child { border-right: none; }
        .fleet-summary .fs-label { font-size: 11px; color: var(--c-text-3); }
        .fleet-summary .fs-value { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
        .plate-cell { font-weight: 620; letter-spacing: .02em; }
        .expiry-soon { color: var(--c-warn); font-weight: 600; }
        .expiry-over { color: var(--c-danger); font-weight: 600; }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page" id="page">

            <div class="page-head">
                <div>
                    <div class="crumbs" data-auto-crumbs></div>
                    <h1 class="page-title">车辆档案</h1>
                    <p class="page-desc">车牌、品牌型号、座位、能源类型、状态与保险年检台账</p>
                </div>
                <div class="page-actions">
                    <label class="search-wrap">
                        <svg class="ico" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.4"/><path d="M13 13l3.4 3.4"/></svg>
                        <input type="text" class="search" id="searchInput" placeholder="搜索车牌 / 品牌 / 供应商…" style="width:250px">
                    </label>
                    <button class="btn btn-primary" id="btnAdd">
                        <svg class="ico" viewBox="0 0 20 20"><path d="M10 4.2v11.6M4.2 10h11.6"/></svg>
                        新增车辆
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="fleet-summary" id="fleetSummary"></div>
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>车牌号</th>
                            <th>品牌 / 型号</th>
                            <th>车型</th>
                            <th>座位</th>
                            <th>能源</th>
                            <th>状态</th>
                            <th>供应商</th>
                            <th>保险到期</th>
                            <th>年检到期</th>
                            <th class="col-actions">操作</th>
                        </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="modal" class="modal-mask" style="display:none">
    <div class="modal">
        <h3 id="modalTitle">新增车辆</h3>
        <p class="modal-desc">车牌号唯一，保存后可在列表与工作台统计中生效</p>
        <div class="field">
            <label>车牌号<span class="req">*</span></label>
            <input type="text" class="input" id="fPlate" maxlength="20" placeholder="如 京B12345D">
        </div>
        <div class="field-row">
            <div class="field">
                <label>品牌 / 型号</label>
                <input type="text" class="input" id="fBrand" maxlength="50" placeholder="如 宇通 ZK6122">
            </div>
            <div class="field">
                <label>座位数</label>
                <input type="number" class="input" id="fSeat" min="1" max="200" placeholder="如 48">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>车型</label>
                <select class="select" id="fType">
                    <option value="大巴">大巴</option>
                    <option value="中巴">中巴</option>
                    <option value="考斯特">考斯特</option>
                </select>
            </div>
            <div class="field">
                <label>能源类型</label>
                <select class="select" id="fEnergy">
                    <option value="">未填写</option>
                    <option value="燃油">燃油</option>
                    <option value="纯电">纯电</option>
                    <option value="混动">混动</option>
                </select>
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>车辆状态</label>
                <select class="select" id="fStatus">
                    <option value="运营中">运营中</option>
                    <option value="维修">维修</option>
                    <option value="停运">停运</option>
                </select>
            </div>
            <div class="field">
                <label>供应商</label>
                <input type="text" class="input" id="fSupplier" maxlength="50" placeholder="如 新朗途 / 驰锐">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>保险到期日</label>
                <input type="date" class="input" id="fInsurance">
            </div>
            <div class="field">
                <label>年检到期日</label>
                <input type="date" class="input" id="fInspection">
            </div>
        </div>
        <div class="btn-row">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    initShell();

    const API = { vehicles: '/api/vehicles' };
    let vehicles = [];
    let editingId = null;

    async function load() {
        try {
            vehicles = await api(API.vehicles) || [];
            renderSummary();
            render();
        } catch (err) { toast('加载失败：' + err.message, true); }
    }

    function typePill(t) {
        const cls = t === '大巴' ? 'pill-info' : t === '中巴' ? 'pill-warn' : 'pill-neutral';
        return '<span class="pill no-dot ' + cls + '">' + esc(t || '-') + '</span>';
    }
    function statusPill(s) {
        const cls = s === '维修' ? 'pill-warn' : s === '停运' ? 'pill-danger' : 'pill-ok';
        return '<span class="pill ' + cls + '">' + esc(s || '运营中') + '</span>';
    }

    // 到期日着色：逾期红、60 天内橙
    function expiryCell(d) {
        if (!d) return '<span class="muted">—</span>';
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const dt = new Date(d + 'T00:00:00');
        const days = Math.round((dt - today) / 86400000);
        let cls = '';
        if (days < 0) cls = 'expiry-over';
        else if (days <= 60) cls = 'expiry-soon';
        return '<span class="mono ' + cls + '">' + esc(d) + '</span>';
    }

    function renderSummary() {
        const total = vehicles.length;
        const running = vehicles.filter(v => (v.status || '运营中') === '运营中').length;
        const maintain = vehicles.filter(v => v.status === '维修').length;
        const out = vehicles.filter(v => v.status === '停运').length;
        const seats = vehicles.reduce((s, v) => s + (v.seatCount || 0), 0);
        $('fleetSummary').innerHTML =
            '<div class="fs-item"><span class="fs-label">车辆总数</span><span class="fs-value">' + total + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">运营中</span><span class="fs-value" style="color:var(--c-ok)">' + running + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">维修</span><span class="fs-value" style="color:var(--c-warn)">' + maintain + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">停运</span><span class="fs-value" style="color:var(--c-danger)">' + out + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">总座位</span><span class="fs-value">' + seats + '</span></div>';
    }

    function render() {
        const kw = $('searchInput').value.trim().toLowerCase();
        const list = vehicles.filter(v => {
            if (!kw) return true;
            return (v.plateNumber + ' ' + (v.brandModel || '') + ' ' + (v.supplier || '')).toLowerCase().includes(kw);
        });
        const tbody = $('tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="10">' +
                '<div class="empty-state"><div class="em-title">没有匹配的车辆</div>' +
                '<div class="em-desc">换个关键词，或点击右上角「新增车辆」录入</div></div></td></tr>';
            return;
        }
        tbody.innerHTML = list.map(v =>
            '<tr>' +
            '<td><div class="cell-stack"><span class="plate-cell">' + esc(v.plateNumber) + '</span>' +
            '<span class="sub">ID ' + v.id + '</span></div></td>' +
            '<td>' + (v.brandModel ? esc(v.brandModel) : '<span class="muted">未填写</span>') + '</td>' +
            '<td>' + typePill(v.vehicleType) + '</td>' +
            '<td class="mono">' + (v.seatCount != null ? v.seatCount : '<span class="muted">—</span>') + '</td>' +
            '<td>' + (v.energyType ? esc(v.energyType) : '<span class="muted">—</span>') + '</td>' +
            '<td>' + statusPill(v.status) + '</td>' +
            '<td>' + (v.supplier ? esc(v.supplier) : '<span class="muted">—</span>') + '</td>' +
            '<td>' + expiryCell(v.insuranceExpiry) + '</td>' +
            '<td>' + expiryCell(v.inspectionExpiry) + '</td>' +
            '<td class="col-actions">' +
            '<button class="btn btn-sm" data-edit="' + v.id + '">编辑</button> ' +
            '<button class="btn btn-sm btn-danger" data-del="' + v.id + '">删除</button></td>' +
            '</tr>'
        ).join('');
        tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(parseInt(b.dataset.edit))));
        tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(parseInt(b.dataset.del))));
    }

    function openModal(id) {
        editingId = id || null;
        $('modalTitle').textContent = id ? '编辑车辆' : '新增车辆';
        const v = id ? vehicles.find(x => x.id === id) : null;
        $('fPlate').value = v ? v.plateNumber : '';
        $('fBrand').value = v ? (v.brandModel || '') : '';
        $('fSeat').value = v && v.seatCount != null ? v.seatCount : '';
        $('fType').value = v && v.vehicleType ? v.vehicleType : '大巴';
        $('fEnergy').value = v && v.energyType ? v.energyType : '';
        $('fStatus').value = v && v.status ? v.status : '运营中';
        $('fSupplier').value = v ? (v.supplier || '') : '';
        $('fInsurance').value = v ? (v.insuranceExpiry || '') : '';
        $('fInspection').value = v ? (v.inspectionExpiry || '') : '';
        $('modal').style.display = '';
        $('fPlate').focus();
    }

    function closeModal() { $('modal').style.display = 'none'; }

    async function save() {
        const plate = $('fPlate').value.trim();
        if (!plate) { toast('车牌号不能为空', true); return; }
        const body = {
            plateNumber: plate,
            brandModel: $('fBrand').value.trim() || null,
            seatCount: $('fSeat').value ? parseInt($('fSeat').value) : null,
            vehicleType: $('fType').value,
            energyType: $('fEnergy').value || null,
            status: $('fStatus').value || '运营中',
            supplier: $('fSupplier').value.trim() || null,
            insuranceExpiry: $('fInsurance').value || null,
            inspectionExpiry: $('fInspection').value || null
        };
        try {
            if (editingId) {
                await api(API.vehicles + '/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已更新：' + plate);
            } else {
                await api(API.vehicles, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已新增：' + plate);
            }
            closeModal();
            await load();
        } catch (err) { toast('保存失败：' + err.message, true); }
    }

    async function remove(id) {
        const v = vehicles.find(x => x.id === id);
        if (!v) return;
        if (!confirm('确定删除车辆「' + v.plateNumber + '」？此操作不可恢复。')) return;
        try {
            await api(API.vehicles + '/' + id, { method: 'DELETE' });
            toast('已删除：' + v.plateNumber);
            await load();
        } catch (err) { toast('删除失败：' + err.message, true); }
    }

    $('searchInput').addEventListener('input', render);
    $('btnAdd').addEventListener('click', () => openModal(null));
    $('btnCancel').addEventListener('click', closeModal);
    $('btnSave').addEventListener('click', save);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').style.display !== 'none') closeModal(); });

    load();
</script>
</body>
</html>
