server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: shuttle
  datasource:
    url: jdbc:mysql://svc-mysql.ucmp-ctl.svc.cluster.local:3001/ucmp_shuttle?sslMode=REQUIRED&verifyServerCertificate=false
    username: ucmp_dev
    password: xeeNADMYQpqZ8F9Wh3Zn
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    apiversion:
      use:
        header: X-API-Version
      default: v1

app:
  upload:
    dir: ${UPLOAD_DIR:./data/uploads}
    max-width: 1024
    max-height: 1024
    quality: 0.8
  default-agency-id: ${DEFAULT_AGENCY_ID:KD}
  map-banner:
    # 线路总览大地图底部横幅标题（环境变量可覆盖：MAP_BANNER_TITLE）
    title: ${MAP_BANNER_TITLE:昆仑数智班车线路图}
  map:
    # 地图默认中心/缩放（初始视野兜底 + 地名搜索 geocode 偏好）
    # 换城市部署只需覆盖：MAP_CENTER_LAT / MAP_CENTER_LON / MAP_CENTER_ZOOM
    center-lat: ${MAP_CENTER_LAT:39.9042}
    center-lon: ${MAP_CENTER_LON:116.4074}
    zoom: ${MAP_CENTER_ZOOM:11}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs