<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>司机档案 · 班车调度管理</title>
    <meta name="nav" content="drivers.archives">
    <link rel="stylesheet" href="css/app.css">
    <script>try{if(localStorage.getItem('shuttle.sidebar.collapsed')==='1')document.documentElement.classList.add('sb-collapsed');}catch(e){}</script>
    <style>
        .driver-summary {
            display: flex; align-items: center; padding: 0 18px;
            border-bottom: 1px solid var(--c-border); overflow-x: auto;
        }
        .driver-summary .fs-item {
            display: flex; flex-direction: column; gap: 1px;
            padding: 12px 20px 12px 0; margin-right: 20px;
            border-right: 1px solid #f1f3f6; white-space: nowrap;
        }
        .driver-summary .fs-item:last-child { border-right: none; }
        .driver-summary .fs-label { font-size: 11px; color: var(--c-text-3); }
        .driver-summary .fs-value { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: var(--c-primary-soft); color: var(--c-primary-ink);
            display: flex; align-items: center; justify-content: center;
            font-size: 12.5px; font-weight: 650; flex-shrink: 0;
        }
        .name-cell { display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page" id="page">

            <div class="page-head">
                <div>
                    <div class="crumbs" data-auto-crumbs></div>
                    <h1 class="page-title">司机档案</h1>
                    <p class="page-desc">司机姓名、证件、准驾车型与联系方式台账</p>
                </div>
                <div class="page-actions">
                    <label class="search-wrap">
                        <svg class="ico" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.4"/><path d="M13 13l3.4 3.4"/></svg>
                        <input type="text" class="search" id="searchInput" placeholder="搜索姓名 / 手机号 / 身份证号…" style="width:250px">
                    </label>
                    <button class="btn btn-primary" id="btnAdd">
                        <svg class="ico" viewBox="0 0 20 20"><path d="M10 4.2v11.6M4.2 10h11.6"/></svg>
                        新增司机
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="driver-summary" id="driverSummary"></div>
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>司机姓名</th>
                            <th>性别</th>
                            <th>手机号</th>
                            <th>准驾车型</th>
                            <th>驾驶证编号</th>
                            <th>身份证号</th>
                            <th>录入时间</th>
                            <th class="col-actions">操作</th>
                        </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="modal" class="modal-mask" style="display:none">
    <div class="modal">
        <h3 id="modalTitle">新增司机</h3>
        <p class="modal-desc">姓名、证件与准驾车型用于班次派车时的人员指派</p>
        <div class="field-row">
            <div class="field">
                <label>司机姓名<span class="req">*</span></label>
                <input type="text" class="input" id="fName" maxlength="30" placeholder="如 宋永建">
            </div>
            <div class="field">
                <label>性别</label>
                <select class="select" id="fGender">
                    <option value="">未填写</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>手机号</label>
                <input type="text" class="input" id="fPhone" maxlength="20" placeholder="如 13439306770">
            </div>
            <div class="field">
                <label>身份证号</label>
                <input type="text" class="input" id="fIdCard" maxlength="18" placeholder="18 位身份证号">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>准驾车型</label>
                <input type="text" class="input" id="fLicenseClass" maxlength="20" placeholder="如 A1 / A3 / C1">
            </div>
            <div class="field">
                <label>驾驶证编号</label>
                <input type="text" class="input" id="fLicenseNumber" maxlength="30" placeholder="驾驶证编号">
            </div>
        </div>
        <div class="btn-row">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    initShell();

    const API = { drivers: '/api/drivers' };
    let drivers = [];
    let editingId = null;

    async function load() {
        try {
            drivers = await api(API.drivers) || [];
            renderSummary();
            render();
        } catch (err) { toast('加载失败：' + err.message, true); }
    }

    function renderSummary() {
        const total = drivers.length;
        const withPhone = drivers.filter(d => d.phone).length;
        $('driverSummary').innerHTML =
            '<div class="fs-item"><span class="fs-label">司机总数</span><span class="fs-value">' + total + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">已登记手机号</span><span class="fs-value" style="color:var(--c-ok)">' + withPhone + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">待补充联系方式</span><span class="fs-value" style="color:var(--c-warn)">' + (total - withPhone) + '</span></div>';
    }

    function fmtDate(s) {
        if (!s) return '<span class="muted">—</span>';
        return esc(String(s).replace('T', ' ').slice(0, 16));
    }

    function render() {
        const kw = $('searchInput').value.trim().toLowerCase();
        const list = drivers.filter(d => {
            if (!kw) return true;
            const hay = [d.name, d.phone, d.idCardNumber, d.licenseClass, d.licenseNumber].filter(Boolean).join(' ');
            return hay.toLowerCase().includes(kw);
        });
        const tbody = $('tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="8">' +
                '<div class="empty-state"><div class="em-title">没有匹配的司机</div>' +
                '<div class="em-desc">换个关键词，或点击右上角「新增司机」录入</div></div></td></tr>';
            return;
        }
        tbody.innerHTML = list.map(d => {
            const initial = (d.name || '?').trim().charAt(0);
            return '<tr>' +
                '<td><div class="name-cell"><span class="avatar">' + esc(initial) + '</span>' +
                '<div class="cell-stack"><span class="strong">' + esc(d.name) + '</span>' +
                '<span class="sub">ID ' + d.id + '</span></div></div></td>' +
                '<td>' + (d.gender ? esc(d.gender) : '<span class="muted">—</span>') + '</td>' +
                '<td class="mono">' + (d.phone ? esc(d.phone) : '<span class="muted">未填写</span>') + '</td>' +
                '<td>' + (d.licenseClass ? esc(d.licenseClass) : '<span class="muted">—</span>') + '</td>' +
                '<td class="mono">' + (d.licenseNumber ? esc(d.licenseNumber) : '<span class="muted">—</span>') + '</td>' +
                '<td class="mono">' + (d.idCardNumber ? esc(d.idCardNumber) : '<span class="muted">—</span>') + '</td>' +
                '<td class="muted mono">' + fmtDate(d.createdDate) + '</td>' +
                '<td class="col-actions">' +
                '<button class="btn btn-sm" data-edit="' + d.id + '">编辑</button> ' +
                '<button class="btn btn-sm btn-danger" data-del="' + d.id + '">删除</button></td>' +
                '</tr>';
        }).join('');
        tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(parseInt(b.dataset.edit))));
        tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(parseInt(b.dataset.del))));
    }

    function openModal(id) {
        editingId = id || null;
        $('modalTitle').textContent = id ? '编辑司机' : '新增司机';
        const d = id ? drivers.find(x => x.id === id) : null;
        $('fName').value = d ? d.name : '';
        $('fGender').value = d ? (d.gender || '') : '';
        $('fPhone').value = d ? (d.phone || '') : '';
        $('fIdCard').value = d ? (d.idCardNumber || '') : '';
        $('fLicenseClass').value = d ? (d.licenseClass || '') : '';
        $('fLicenseNumber').value = d ? (d.licenseNumber || '') : '';
        $('modal').style.display = '';
        $('fName').focus();
    }

    function closeModal() { $('modal').style.display = 'none'; }

    async function save() {
        const name = $('fName').value.trim();
        if (!name) { toast('司机姓名不能为空', true); return; }
        const body = {
            name: name,
            phone: $('fPhone').value.trim() || null,
            idCardNumber: $('fIdCard').value.trim() || null,
            gender: $('fGender').value || null,
            licenseClass: $('fLicenseClass').value.trim() || null,
            licenseNumber: $('fLicenseNumber').value.trim() || null
        };
        try {
            if (editingId) {
                await api(API.drivers + '/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已更新：' + name);
            } else {
                await api(API.drivers, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已新增：' + name);
            }
            closeModal();
            await load();
        } catch (err) { toast('保存失败：' + err.message, true); }
    }

    async function remove(id) {
        const d = drivers.find(x => x.id === id);
        if (!d) return;
        if (!confirm('确定删除司机「' + d.name + '」？此操作不可恢复。')) return;
        try {
            await api(API.drivers + '/' + id, { method: 'DELETE' });
            toast('已删除：' + d.name);
            await load();
        } catch (err) { toast('删除失败：' + err.message, true); }
    }

    $('searchInput').addEventListener('input', render);
    $('btnAdd').addEventListener('click', () => openModal(null));
    $('btnCancel').addEventListener('click', closeModal);
    $('btnSave').addEventListener('click', save);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').style.display !== 'none') closeModal(); });

    load();
</script>
</body>
</html>
