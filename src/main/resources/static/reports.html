<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营报表 · 班车调度管理</title>
    <meta name="nav" content="ops.reports">
    <link rel="stylesheet" href="css/app.css">
    <script>try{if(localStorage.getItem('shuttle.sidebar.collapsed')==='1')document.documentElement.classList.add('sb-collapsed');}catch(e){}</script>
    <style>
        .chart-box { position: relative; height: 280px; }
        .reports-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
        @media (max-width: 1100px) { .reports-row { grid-template-columns: 1fr; } }
        .demo-banner {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 14px; border: 1px dashed var(--c-border-strong);
            border-radius: var(--radius-sm); color: var(--c-text-3); font-size: 12.5px;
            background: #fafbfc; margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page">

            <div class="page-head">
                <div>
                    <div class="crumbs" data-auto-crumbs></div>
                    <h1 class="page-title">运营报表</h1>
                </div>
            </div>

            <div class="demo-banner">
                <svg class="ico" viewBox="0 0 20 20" style="width:15px;height:15px"><path d="M10 3.2 17.4 16H2.6z"/><path d="M10 8v3.4M10 13.6v.6"/></svg>
                当前为演示数据，后续接入真实运营数据（发车、载客、准点）
            </div>

            <!-- 指标卡 -->
            <div class="stat-grid" id="statGrid"></div>

            <!-- 趋势图：满载率 + 准点率 -->
            <div class="reports-row" style="margin-top:16px">
                <div class="card">
                    <div class="card-head">
                        <div>
                            <div class="card-title">满载率趋势</div>
                            <div class="card-sub">近 14 天平均满载率</div>
                        </div>
                    </div>
                    <div class="card-body"><div class="chart-box"><canvas id="loadChart"></canvas></div></div>
                </div>
                <div class="card">
                    <div class="card-head">
                        <div>
                            <div class="card-title">准点率趋势</div>
                            <div class="card-sub">近 14 天平均准点率</div>
                        </div>
                    </div>
                    <div class="card-body"><div class="chart-box"><canvas id="punctChart"></canvas></div></div>
                </div>
            </div>

            <!-- 各线路满载率对比 -->
            <div class="card" style="margin-top:16px">
                <div class="card-head">
                    <div>
                        <div class="card-title">各线路满载率对比</div>
                        <div class="card-sub">柱体颜色：≥90% 红 · 80~89% 橙 · &lt;80% 绿</div>
                    </div>
                </div>
                <div class="card-body"><div class="chart-box" style="height:320px"><canvas id="routeChart"></canvas></div></div>
            </div>

            <!-- 客流 -->
            <div class="reports-row" style="margin-top:16px">
                <div class="card">
                    <div class="card-head">
                        <div>
                            <div class="card-title">各线路客流量排行</div>
                            <div class="card-sub">近 7 天累计载客（演示数据）</div>
                        </div>
                    </div>
                    <div class="card-body"><div class="chart-box"><canvas id="passengerChart"></canvas></div></div>
                </div>
                <div class="card">
                    <div class="card-head">
                        <div>
                            <div class="card-title">高峰时段客流分布</div>
                            <div class="card-sub">分时段载客量（演示数据）</div>
                        </div>
                    </div>
                    <div class="card-body"><div class="chart-box"><canvas id="hourChart"></canvas></div></div>
                </div>
            </div>

            <!-- 延误分布 -->
            <div class="card" style="margin-top:16px">
                <div class="card-head">
                    <div>
                        <div class="card-title">延误时长分布</div>
                        <div class="card-sub">班次延误分钟数占比（演示数据）</div>
                    </div>
                </div>
                <div class="card-body"><div class="chart-box"><canvas id="delayChart"></canvas></div></div>
            </div>

        </div>
    </div>
</div>

<div id="toast"></div>
<script src="vendor/chart.js/chart.umd.js"></script>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    initShell();

    // ===== 演示数据（未来替换为真实运营数据） =====
    const days = [];
    for (let i = 13; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        days.push((d.getMonth() + 1) + '/' + d.getDate());
    }
    const loadFactor = [78, 82, 80, 88, 91, 86, 93, 90, 95, 92, 96, 94, 97, 95];
    const punctuality = [90, 88, 92, 91, 94, 93, 95, 92, 96, 94, 97, 95, 98, 96];
    const routeLoad = [
        { name: '天通苑-昌平1', v: 96 },
        { name: '霍营-昌平', v: 88 },
        { name: '雍和宫-昌平1', v: 90 },
        { name: '东坝支线', v: 82 },
        { name: '昌平水屯-八角', v: 75 },
        { name: '涿州-八角', v: 68 }
    ];

    const avg = arr => Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
    const avgLoad = avg(loadFactor);
    const avgPunct = avg(punctuality);
    const warnCount = routeLoad.filter(r => r.v >= 90).length;

    // ===== 指标卡 =====
    $('statGrid').innerHTML = '' +
        statCard('平均满载率', avgLoad, '%', 'bus', '近 14 天均值 · 演示数据', true) +
        statCard('平均准点率', avgPunct, '%', 'clock', '近 14 天均值 · 演示数据') +
        statCard('运营班次', 52, '班', 'route', '在册班次总量 · 演示数据') +
        statCard('高负载车辆', warnCount, '辆', 'alert', '满载率 ≥90% 的线路 · 演示数据');

    function statCard(label, value, unit, icon, foot, accent) {
        return '<div class="stat-card' + (accent ? ' accent' : '') + '">' +
            '<div class="stat-top"><span class="stat-label">' + iconSvg(icon) + esc(label) + '</span></div>' +
            '<div class="stat-value">' + value + '<span class="unit">' + unit + '</span></div>' +
            '<div class="stat-foot">' + foot + '</div></div>';
    }

    // ===== Chart.js 主题色 =====
    const TEAL = '#14b8a6';
    const BLUE = '#1a6fd4';
    Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif";
    Chart.defaults.color = '#8d95a3';
    Chart.defaults.borderColor = '#eef1f4';

    const pctTicks = { callback: v => v + '%' };
    const yScale = { min: 0, max: 100, ticks: pctTicks };

    // ===== 满载率趋势 =====
    new Chart($('loadChart'), {
        type: 'line',
        data: {
            labels: days,
            datasets: [{
                label: '满载率',
                data: loadFactor,
                borderColor: TEAL,
                backgroundColor: 'rgba(20,184,166,0.10)',
                fill: true,
                tension: 0.35,
                pointRadius: 3,
                pointBackgroundColor: TEAL
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: yScale } }
    });

    // ===== 准点率趋势 =====
    new Chart($('punctChart'), {
        type: 'line',
        data: {
            labels: days,
            datasets: [{
                label: '准点率',
                data: punctuality,
                borderColor: BLUE,
                backgroundColor: 'rgba(26,111,212,0.10)',
                fill: true,
                tension: 0.35,
                pointRadius: 3,
                pointBackgroundColor: BLUE
            }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: yScale } }
    });

    // ===== 各线路满载率对比（柱体按高低着色） =====
    new Chart($('routeChart'), {
        type: 'bar',
        data: {
            labels: routeLoad.map(r => r.name),
            datasets: [{
                label: '满载率',
                data: routeLoad.map(r => r.v),
                backgroundColor: routeLoad.map(r => r.v >= 90 ? '#e0685b' : r.v >= 80 ? '#e8a33d' : '#14b8a6'),
                borderRadius: 5,
                maxBarThickness: 46
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: yScale, x: { grid: { display: false } } }
        }
    });

    // ===== 各线路客流量排行（横向柱状） =====
    const passengerRank = [
        { name: '天通苑-昌平1', v: 1280 },
        { name: '霍营-昌平', v: 960 },
        { name: '雍和宫-昌平1', v: 890 },
        { name: '东坝支线', v: 640 },
        { name: '昌平水屯-八角', v: 520 },
        { name: '涿州-八角', v: 430 }
    ].sort((a, b) => b.v - a.v);
    new Chart($('passengerChart'), {
        type: 'bar',
        data: {
            labels: passengerRank.map(r => r.name),
            datasets: [{
                label: '载客量',
                data: passengerRank.map(r => r.v),
                backgroundColor: 'rgba(20,184,166,0.72)',
                borderRadius: 5,
                maxBarThickness: 22
            }]
        },
        options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { x: { grid: { display: false } } }
        }
    });

    // ===== 高峰时段客流分布 =====
    const hourLabels = ['6点', '7点', '8点', '9点', '12点', '17点', '18点', '19点'];
    const hourPassenger = [180, 620, 540, 260, 120, 480, 560, 220];
    new Chart($('hourChart'), {
        type: 'bar',
        data: {
            labels: hourLabels,
            datasets: [{
                label: '载客量',
                data: hourPassenger,
                backgroundColor: hourPassenger.map(v => v >= 500 ? '#e0685b' : '#14b8a6'),
                borderRadius: 5,
                maxBarThickness: 36
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { grid: { display: false } } }
        }
    });

    // ===== 延误时长分布（环形） =====
    new Chart($('delayChart'), {
        type: 'doughnut',
        data: {
            labels: ['0-5 分钟', '5-10 分钟', '10 分钟以上'],
            datasets: [{
                data: [82, 13, 5],
                backgroundColor: ['#14b8a6', '#e8a33d', '#e0685b'],
                borderWidth: 2,
                borderColor: '#fff'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'right' } },
            cutout: '62%'
        }
    });
</script>
</body>
</html>
