<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>司机档案 · 班车调度管理</title>
    <meta name="nav" content="drivers.archives">
    <link rel="stylesheet" href="css/app.css">
    <script>try{if(localStorage.getItem('shuttle.sidebar.collapsed')==='1')document.documentElement.classList.add('sb-collapsed');}catch(e){}</script>
    <style>
        .driver-summary {
            display: flex; align-items: center; padding: 0 18px;
            border-bottom: 1px solid var(--c-border); overflow-x: auto;
        }
        .driver-summary .fs-item {
            display: flex; flex-direction: column; gap: 1px;
            padding: 12px 20px 12px 0; margin-right: 20px;
            border-right: 1px solid #f1f3f6; white-space: nowrap;
        }
        .driver-summary .fs-item:last-child { border-right: none; }
        .driver-summary .fs-label { font-size: 11px; color: var(--c-text-3); }
        .driver-summary .fs-value { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
        .name-cell { display: flex; align-items: center; gap: 10px; }
        /* 性别图标：姓名前的圆形标识，男=蓝(箭头)、女=粉(圆圈) */
        .gender-ico {
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
        }
        .gender-ico svg {
            width: 13px; height: 13px; fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .gender-m { background: var(--c-info-soft); color: var(--c-info); }
        .gender-f { background: #fdeef4; color: #d63384; }
        .gender-none { background: #f1f3f5; color: var(--c-text-3); }

        /* 头像上传与显示 */
        .avatar-upload { display: flex; align-items: center; gap: 10px; }
        .avatar-box {
            width: 56px; height: 56px; border-radius: 50%;
            border: 1px solid var(--c-border); background: #f7f8fa;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
            color: var(--c-text-3); font-size: 12px;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-img {
            width: 26px; height: 26px; border-radius: 50%;
            overflow: hidden; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .avatar-img img { width: 100%; height: 100%; object-fit: cover; }

        /* 头像悬浮大图预览浮层 */
        .avatar-float {
            position: fixed;
            z-index: 300;
            pointer-events: none;
            width: 120px; height: 120px;
            padding: 3px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(16, 24, 40, .22);
        }
        .avatar-float img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }

        /* 列设置下拉面板 */
        .cols-wrap { position: relative; }
        .col-panel {
            position: absolute; top: calc(100% + 6px); right: 0; z-index: 60;
            min-width: 190px; background: #fff;
            border: 1px solid var(--c-border); border-radius: 8px;
            box-shadow: var(--shadow-2); padding: 6px;
        }
        .col-panel .cp-title {
            font-size: 11px; font-weight: 700; letter-spacing: .05em;
            text-transform: uppercase; color: var(--c-text-3); padding: 4px 8px 6px;
        }
        .col-panel .cp-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 8px; border-radius: 6px;
            font-size: 12.5px; color: var(--c-text-2);
            cursor: pointer; user-select: none;
        }
        .col-panel .cp-item:hover { background: #f7f8fa; }
        .col-panel .cp-item input { margin: 0; accent-color: var(--c-primary); }

        /* 防窥打码：身份证号/驾驶证编号默认打码，点眼睛切换显示 */
        .mask-wrap { display: inline-flex; align-items: center; gap: 6px; }
        .mask-txt {
            font-variant-numeric: tabular-nums;
            min-width: 18ch;   /* 固定占位=18位号码宽度，切换显示/打码时列宽不跳动 */
        }
        .mask-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border: none; background: transparent;
            color: var(--c-text-3); cursor: pointer; border-radius: 5px; padding: 0;
            flex-shrink: 0;
        }
        .mask-toggle:hover { background: #f1f3f5; color: var(--c-text-2); }
        .mask-toggle .ico {
            width: 14px; height: 14px; stroke: currentColor; fill: none;
            stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
        }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page" id="page">

            <div class="page-head">
                <div>
                    <div class="crumbs" data-auto-crumbs></div>
                    <h1 class="page-title">司机档案</h1>
                    <p class="page-desc">司机姓名、证件、准驾车型与联系方式台账</p>
                </div>
                <div class="page-actions">
                    <label class="search-wrap">
                        <svg class="ico" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.4"/><path d="M13 13l3.4 3.4"/></svg>
                        <input type="text" class="search" id="searchInput" placeholder="搜索姓名 / 手机号 / 身份证号…" style="width:250px">
                    </label>
                    <div class="cols-wrap">
                        <button class="btn" id="btnCols" title="设置显示列">
                            <svg class="ico" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 9h14M3 14h14M9.5 4v13M14.5 4v13"/></svg>
                            列设置
                        </button>
                        <div class="col-panel" id="colPanel" style="display:none"></div>
                    </div>
                    <button class="btn btn-primary" id="btnAdd">
                        <svg class="ico" viewBox="0 0 20 20"><path d="M10 4.2v11.6M4.2 10h11.6"/></svg>
                        新增司机
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="driver-summary" id="driverSummary"></div>
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr id="theadRow"></tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="modal" class="modal-mask" style="display:none">
    <div class="modal">
        <h3 id="modalTitle">新增司机</h3>
        <p class="modal-desc">姓名、证件与准驾车型用于班次派车时的人员指派</p>
        <div class="field">
            <label>头像</label>
            <div class="avatar-upload">
                <div class="avatar-box" id="avatarBox">无头像</div>
                <button type="button" class="btn btn-sm" id="btnAvatar">上传头像</button>
                <button type="button" class="btn btn-sm" id="btnAvatarClear" style="display:none">移除</button>
                <input type="file" id="avatarFile" accept="image/*" style="display:none">
                <input type="hidden" id="fAvatar">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>司机姓名<span class="req">*</span></label>
                <input type="text" class="input" id="fName" maxlength="30" placeholder="如 宋永建">
            </div>
            <div class="field">
                <label>性别</label>
                <select class="select" id="fGender">
                    <option value="">未填写</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>手机号</label>
                <input type="text" class="input" id="fPhone" maxlength="20" placeholder="如 13439306770">
            </div>
            <div class="field">
                <label>状态</label>
                <select class="select" id="fStatus">
                    <option value="在岗">在岗</option>
                    <option value="休假">休假</option>
                    <option value="停用">停用</option>
                </select>
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>身份证号</label>
                <input type="text" class="input" id="fIdCard" maxlength="18" placeholder="18 位身份证号">
            </div>
            <div class="field">
                <label>准驾车型</label>
                <input type="text" class="input" id="fLicenseClass" maxlength="20" placeholder="如 A1 / A3 / C1">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>驾驶证编号</label>
                <input type="text" class="input" id="fLicenseNumber" maxlength="30" placeholder="驾驶证编号">
            </div>
        </div>
        <div class="btn-row">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<div id="avatarFloat" class="avatar-float" style="display:none"></div>
<div id="toast"></div>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    initShell();

    const API = { drivers: '/api/drivers' };
    let drivers = [];
    let editingId = null;

    async function load() {
        try {
            drivers = await api(API.drivers) || [];
            renderSummary();
            render();
        } catch (err) { toast('加载失败：' + err.message, true); }
    }

    function renderSummary() {
        const total = drivers.length;
        const withPhone = drivers.filter(d => d.phone).length;
        $('driverSummary').innerHTML =
            '<div class="fs-item"><span class="fs-label">司机总数</span><span class="fs-value">' + total + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">已登记手机号</span><span class="fs-value" style="color:var(--c-ok)">' + withPhone + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">待补充联系方式</span><span class="fs-value" style="color:var(--c-warn)">' + (total - withPhone) + '</span></div>';
    }

    function fmtDate(s) {
        if (!s) return '<span class="muted">—</span>';
        return esc(String(s).replace('T', ' ').slice(0, 16));
    }

    function genderIcon(g) {
        const male = '<svg viewBox="0 0 24 24"><circle cx="10" cy="14" r="5.5"/><path d="M14.5 9.5L19 5M19 5h-4M19 5v4"/></svg>';
        const female = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5.5"/><path d="M12 13.5V20M9 17h6"/></svg>';
        if (g === '男') return '<span class="gender-ico gender-m" title="男">' + male + '</span>';
        if (g === '女') return '<span class="gender-ico gender-f" title="女">' + female + '</span>';
        return '<span class="gender-ico gender-none" title="未填写">—</span>';
    }

    function driverAvatar(d) {
        if (d.avatarUrl) {
            return '<span class="avatar-img" title="' + esc(d.name) + '"><img src="' + esc(d.avatarUrl) + '" alt=""></span>';
        }
        return genderIcon(d.gender);
    }

    function driverStatusPill(s) {
        const v = s || '在岗';
        const cls = v === '休假' ? 'pill-warn' : v === '停用' ? 'pill-neutral' : 'pill-ok';
        return '<span class="pill ' + cls + '">' + esc(v) + '</span>';
    }

    // 防窥打码：按长度自适应，保证"前段+星号+后段"永不超长、不重叠，
    // 星号数 = 被隐藏位数（最多4），避免短号码打码后比原值还长（如 9 位号前6后4会重叠）
    function maskText(s) {
        const n = s.length;
        if (n <= 4) return '****';
        let front, back;
        if (n >= 16) { front = 6; back = 4; }        // 18 位身份证：前 6 后 4
        else if (n >= 10) { front = 4; back = 4; }   // 11~15 位：前 4 后 4
        else if (n >= 7) { front = 3; back = 3; }    // 7~9 位：前 3 后 3
        else { front = 2; back = 2; }                // 5~6 位：前 2 后 2
        const stars = Math.min(4, n - front - back);
        return s.slice(0, front) + '*'.repeat(stars) + s.slice(-back);
    }
    function maskedCell(v) {
        const eyeSvg = '<svg class="ico" viewBox="0 0 20 20"><path d="M1.8 10S5.2 5 10 5s8.2 5 8.2 5-3.4 5-8.2 5-8.2-5-8.2-5z"/><circle cx="10" cy="10" r="2.6"/></svg>';
        // 空值也渲染同样的 mask-txt + 隐藏眼睛占位，保证列宽在"全空 → 首次有数据"时不变
        if (!v) {
            return '<span class="mask-wrap"><span class="mask-txt mono muted">—</span>' +
                '<span class="mask-toggle" aria-hidden="true" style="visibility:hidden">' + eyeSvg + '</span></span>';
        }
        return '<span class="mask-wrap"><span class="mask-txt mono">' + esc(maskText(v)) + '</span>' +
            '<button type="button" class="mask-toggle" data-full="' + esc(v) + '" title="显示/隐藏">' + eyeSvg + '</button></span>';
    }

    // ===== 列配置：key 用于持久化；required 固定；cell(d) 返回整格 <td> =====
    const COLUMNS = [
        { key: 'name', label: '司机姓名', required: true, cell: d =>
            '<td><div class="name-cell">' + driverAvatar(d) +
            '<div class="cell-stack"><span class="strong">' + esc(d.name) + '</span>' +
            '<span class="sub">ID ' + d.id + '</span></div></div></td>' },
        { key: 'phone', label: '手机号', cell: d =>
            '<td class="mono">' + (d.phone ? esc(d.phone) : '<span class="muted">未填写</span>') + '</td>' },
        { key: 'status', label: '状态', cell: d => '<td>' + driverStatusPill(d.status) + '</td>' },
        { key: 'licenseClass', label: '准驾车型', cell: d =>
            '<td>' + (d.licenseClass ? esc(d.licenseClass) : '<span class="muted">—</span>') + '</td>' },
        { key: 'licenseNumber', label: '驾驶证编号', cell: d => '<td>' + maskedCell(d.licenseNumber) + '</td>' },
        { key: 'idCardNumber', label: '身份证号', cell: d => '<td>' + maskedCell(d.idCardNumber) + '</td>' },
        { key: 'createdDate', label: '录入时间', cell: d => '<td class="muted mono">' + fmtDate(d.createdDate) + '</td>' },
        { key: 'actions', label: '操作', required: true, cell: d =>
            '<td class="col-actions"><button class="btn btn-sm" data-edit="' + d.id + '">编辑</button> ' +
            '<button class="btn btn-sm btn-danger" data-del="' + d.id + '">删除</button></td>' }
    ];

    const COL_KEY = 'shuttle.drivers.hiddenCols';
    // 默认隐藏：准驾车型、驾驶证编号、录入时间（次要信息，可勾选展开）
    const DEFAULT_HIDDEN = ['licenseClass', 'licenseNumber', 'createdDate'];
    let hiddenCols = [];
    try {
        const stored = localStorage.getItem(COL_KEY);
        hiddenCols = stored ? JSON.parse(stored) : DEFAULT_HIDDEN.slice();
    } catch (e) { hiddenCols = DEFAULT_HIDDEN.slice(); }

    function visibleColumns() {
        return COLUMNS.filter(c => c.required || hiddenCols.indexOf(c.key) === -1);
    }

    function render() {
        const cols = visibleColumns();
        $('theadRow').innerHTML = cols.map(c =>
            '<th' + (c.key === 'actions' ? ' class="col-actions"' : '') + '>' + c.label + '</th>'
        ).join('');
        const kw = $('searchInput').value.trim().toLowerCase();
        const list = drivers.filter(d => {
            if (!kw) return true;
            const hay = [d.name, d.phone, d.status, d.idCardNumber, d.licenseClass, d.licenseNumber].filter(Boolean).join(' ');
            return hay.toLowerCase().includes(kw);
        });
        const tbody = $('tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="' + cols.length + '">' +
                '<div class="empty-state"><div class="em-title">没有匹配的司机</div>' +
                '<div class="em-desc">换个关键词，或点击右上角「新增司机」录入</div></div></td></tr>';
            return;
        }
        tbody.innerHTML = list.map(d => '<tr>' + cols.map(c => c.cell(d)).join('') + '</tr>').join('');
        tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(parseInt(b.dataset.edit))));
        tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(parseInt(b.dataset.del))));
    }

    // 列设置面板
    function renderColPanel() {
        $('colPanel').innerHTML =
            '<div class="cp-title">显示列</div>' +
            COLUMNS.filter(c => !c.required).map(c =>
                '<label class="cp-item"><input type="checkbox" data-col="' + c.key + '"' +
                (hiddenCols.indexOf(c.key) === -1 ? ' checked' : '') + '> ' + esc(c.label) + '</label>'
            ).join('');
        $('colPanel').querySelectorAll('input[data-col]').forEach(cb => {
            cb.addEventListener('change', () => {
                const key = cb.dataset.col;
                if (cb.checked) hiddenCols = hiddenCols.filter(k => k !== key);
                else if (hiddenCols.indexOf(key) === -1) hiddenCols.push(key);
                localStorage.setItem(COL_KEY, JSON.stringify(hiddenCols));
                render();
            });
        });
    }

    function openModal(id) {
        editingId = id || null;
        $('modalTitle').textContent = id ? '编辑司机' : '新增司机';
        const d = id ? drivers.find(x => x.id === id) : null;
        $('fName').value = d ? d.name : '';
        $('fGender').value = d ? (d.gender || '') : '';
        $('fPhone').value = d ? (d.phone || '') : '';
        $('fStatus').value = d && d.status ? d.status : '在岗';
        $('fIdCard').value = d ? (d.idCardNumber || '') : '';
        $('fLicenseClass').value = d ? (d.licenseClass || '') : '';
        $('fLicenseNumber').value = d ? (d.licenseNumber || '') : '';
        renderAvatarBox(d ? d.avatarUrl : null);
        $('modal').style.display = '';
        $('fName').focus();
    }

    function renderAvatarBox(url) {
        $('fAvatar').value = url || '';
        const box = $('avatarBox');
        if (url) {
            box.innerHTML = '<img src="' + esc(url) + '" alt="">';
            $('btnAvatarClear').style.display = '';
        } else {
            box.textContent = '无头像';
            $('btnAvatarClear').style.display = 'none';
        }
    }

    function closeModal() { $('modal').style.display = 'none'; }

    async function save() {
        const name = $('fName').value.trim();
        if (!name) { toast('司机姓名不能为空', true); return; }
        const phone = $('fPhone').value.trim();
        const idCard = $('fIdCard').value.trim();
        // 格式校验：手机号 11 位（1 开头、第二位 3-9）；身份证号 18 位（末位数字或 X）
        if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
            toast('手机号格式不正确：应为 11 位手机号', true);
            return;
        }
        if (idCard && !/^\d{17}[\dXx]$/.test(idCard)) {
            toast('身份证号格式不正确：应为 18 位，末位可为 X', true);
            return;
        }
        const body = {
            name: name,
            phone: phone || null,
            status: $('fStatus').value || '在岗',
            idCardNumber: idCard || null,
            gender: $('fGender').value || null,
            licenseClass: $('fLicenseClass').value.trim() || null,
            licenseNumber: $('fLicenseNumber').value.trim() || null,
            avatarUrl: $('fAvatar').value || null
        };
        try {
            if (editingId) {
                await api(API.drivers + '/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已更新：' + name);
            } else {
                await api(API.drivers, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已新增：' + name);
            }
            closeModal();
            await load();
        } catch (err) { toast('保存失败：' + err.message, true); }
    }

    async function remove(id) {
        const d = drivers.find(x => x.id === id);
        if (!d) return;
        if (!confirm('确定删除司机「' + d.name + '」？此操作不可恢复。')) return;
        try {
            await api(API.drivers + '/' + id, { method: 'DELETE' });
            toast('已删除：' + d.name);
            await load();
        } catch (err) { toast('删除失败：' + err.message, true); }
    }

    $('searchInput').addEventListener('input', render);
    $('btnAdd').addEventListener('click', () => openModal(null));
    $('btnCancel').addEventListener('click', closeModal);
    $('btnSave').addEventListener('click', save);
    $('btnAvatar').addEventListener('click', () => $('avatarFile').click());
    $('avatarFile').addEventListener('change', async () => {
        const file = $('avatarFile').files[0];
        if (!file) return;
        const fd = new FormData();
        fd.append('file', file);
        fd.append('dir', 'avatars');
        try {
            const res = await api('/api/upload', { method: 'POST', body: fd });
            renderAvatarBox(res.url);
            toast('头像已上传');
        } catch (err) { toast('上传失败：' + err.message, true); }
    });
    $('btnAvatarClear').addEventListener('click', () => renderAvatarBox(null));
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    $('btnCols').addEventListener('click', e => {
        e.stopPropagation();
        const p = $('colPanel');
        if (p.style.display === 'none') { renderColPanel(); p.style.display = ''; }
        else p.style.display = 'none';
    });
    document.addEventListener('click', e => {
        const wrap = document.querySelector('.cols-wrap');
        if (wrap && !wrap.contains(e.target)) $('colPanel').style.display = 'none';
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if ($('modal').style.display !== 'none') closeModal();
            $('colPanel').style.display = 'none';
        }
    });
    // 防窥切换（事件委托，render 重绘后仍生效）
    $('tbody').addEventListener('click', e => {
        const t = e.target.closest('.mask-toggle');
        if (!t) return;
        const txt = t.parentElement.querySelector('.mask-txt');
        const showing = t.dataset.showing === '1';
        txt.textContent = showing ? maskText(t.dataset.full) : t.dataset.full;
        t.dataset.showing = showing ? '0' : '1';
    });

    // 头像悬浮大图预览（事件委托）
    const floatEl = $('avatarFloat');
    let floatTimer = null;
    function hideFloat() {
        clearTimeout(floatTimer);
        floatTimer = setTimeout(() => { floatEl.style.display = 'none'; }, 120);
    }
    $('tbody').addEventListener('mouseover', e => {
        const img = e.target.closest('.avatar-img img');
        if (!img) return;
        clearTimeout(floatTimer);
        floatEl.innerHTML = '<img src="' + img.getAttribute('src') + '" alt="">';
        const r = img.getBoundingClientRect();
        let left = r.right + 14;
        let top = r.top + (r.height - 120) / 2;
        if (left + 120 > window.innerWidth - 8) left = r.left - 134;
        if (top < 8) top = 8;
        if (top + 120 > window.innerHeight - 8) top = window.innerHeight - 128;
        floatEl.style.left = left + 'px';
        floatEl.style.top = top + 'px';
        floatEl.style.display = '';
    });
    $('tbody').addEventListener('mouseout', e => {
        if (e.target.closest('.avatar-img img')) hideFloat();
    });

    load();
</script>
</body>
</html>
