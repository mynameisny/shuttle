<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班次管理 · 班车调度管理</title>
    <meta name="nav" content="trips.plan">
    <link rel="stylesheet" href="css/app.css">
    <script>try{if(localStorage.getItem('shuttle.sidebar.collapsed')==='1')document.documentElement.classList.add('sb-collapsed');}catch(e){}</script>
    <style>
        .mono { font-variant-numeric: tabular-nums; }
        .route-badge {
            display: inline-flex; align-items: center;
            margin-left: 10px; padding: 3px 11px;
            background: var(--c-info-soft); color: var(--c-info);
            border-radius: 999px; font-size: 13px; font-weight: 600;
            vertical-align: middle; letter-spacing: 0;
        }
        .dir-ico {
            display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; border-radius: 50%;
            vertical-align: middle; margin-right: 7px; flex-shrink: 0;
        }
        .dir-ico svg {
            width: 11px; height: 11px; fill: none; stroke: currentColor;
            stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
        }
        .dir-go { background: var(--c-ok-soft); color: var(--c-ok); }
        .dir-back { background: var(--c-info-soft); color: var(--c-info); }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page">

            <div class="page-head">
                <div>
                    <div class="crumbs" data-auto-crumbs></div>
                    <h1 class="page-title">班次管理<span id="routeBadge" class="route-badge" style="display:none"></span></h1>
                </div>
                <div class="page-actions">
                    <a class="btn" href="routes.html">返回线路</a>
                    <button class="btn btn-primary" id="btnAdd">新增班次</button>
                </div>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>班次号</th>
                            <th>方向</th>
                            <th>终点</th>
                            <th>服务日历</th>
                            <th>停站数</th>
                            <th class="col-actions">操作</th>
                        </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="modal" class="modal-mask" style="display:none">
    <div class="modal">
        <h3 id="modalTitle">新增班次</h3>
        <p class="modal-desc">班次 ID 唯一，对应 GTFS trips.txt</p>
        <div class="field-row">
            <div class="field">
                <label>班次 ID（自动生成）</label>
                <input type="text" class="input" id="fTripId" maxlength="50" readonly>
            </div>
            <div class="field">
                <label>简称 / 车次号</label>
                <input type="text" class="input" id="fShortName" maxlength="50" placeholder="如 北土城-昌平1">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>方向</label>
                <select class="select" id="fDirection">
                    <option value="0">去程</option>
                    <option value="1">返程</option>
                </select>
            </div>
            <div class="field">
                <label>终点</label>
                <input type="text" class="input" id="fHeadsign" maxlength="100" placeholder="如 北土城-昌平">
            </div>
        </div>
        <div class="field">
            <label>服务日历<span class="req">*</span></label>
            <select class="select" id="fServiceId"></select>
        </div>
        <div class="btn-row">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    initShell();

    const params = new URLSearchParams(location.search);
    const routePk = params.get('routePk');
    let route = null;
    let trips = [];
    let calendars = [];
    let editingId = null;

    async function load() {
        try {
            const [r, t, c] = await Promise.all([
                routePk ? api('/api/routes/' + routePk) : Promise.resolve(null),
                routePk ? api('/api/routes/' + routePk + '/trips') : api('/api/trips'),
                api('/api/calendars')
            ]);
            route = r;
            trips = t || [];
            calendars = c || [];
            const badge = $('routeBadge');
            const rname = route ? (route.routeLongName || route.routeId || '') : '';
            badge.textContent = rname;
            badge.style.display = rname ? '' : 'none';
            render();
        } catch (err) { toast('加载失败：' + err.message, true); }
    }

    function dirPill(d) {
        if (d == null) return '<span class="muted">—</span>';
        return d === 1
            ? '<span class="pill no-dot pill-info">返程</span>'
            : '<span class="pill no-dot pill-ok">去程</span>';
    }

    // trip_id 惯例 = route_id_outbound（去程）/ route_id_inbound（返程），routePk = route_id 数字
    function tripRoutePk(t) {
        const base = (t.tripId || '').replace(/_(outbound|inbound)$/, '');
        const n = parseInt(base, 10);
        return isNaN(n) ? '' : n;
    }

    // 自动生成 trip_id：{route_id}_{outbound|inbound}，同方向已存在则加数字 _2/_3...
    function genTripId(directionId) {
        const base = route ? (route.routeId || '') : '';
        if (!base) return '';
        const suffix = directionId === 1 ? '_inbound' : '_outbound';
        const existing = new Set(trips.map(x => x.tripId));
        let candidate = base + suffix;
        let i = 2;
        while (existing.has(candidate)) {
            candidate = base + suffix + '_' + i;
            i++;
        }
        return candidate;
    }

    function render() {
        const tbody = $('tbody');
        if (!trips.length) {
            tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state">' +
                '<div class="em-title">暂无班次</div>' +
                '<div class="em-desc">点击右上角「新增班次」创建</div></div></td></tr>';
            return;
        }
        tbody.innerHTML = trips.map(t =>
            '<tr>' +
            '<td class="strong mono">' +
            (t.directionId === 1
                ? '<span class="dir-ico dir-back" title="返程"><svg viewBox="0 0 24 24"><path d="M20 12H5M10 6l-6 6 6 6"/></svg></span>'
                : '<span class="dir-ico dir-go" title="去程"><svg viewBox="0 0 24 24"><path d="M4 12h15M14 6l6 6-6 6"/></svg></span>') +
            esc(t.tripShortName || t.tripId) +
            '</td>' +
            '<td>' + dirPill(t.directionId) + '</td>' +
            '<td>' + (t.tripHeadsign ? esc(t.tripHeadsign) : '<span class="muted">—</span>') + '</td>' +
            '<td><span class="pill no-dot pill-neutral mono">' + esc(t.serviceId || '—') + '</span></td>' +
            '<td class="mono">' + (t.stopTimes ? t.stopTimes.length : 0) + '</td>' +
            '<td class="col-actions">' +
            '<a class="btn btn-sm" href="stops.html?routePk=' + tripRoutePk(t) + '">站点</a> ' +
            '<button class="btn btn-sm" data-edit="' + t.id + '">编辑</button> ' +
            '<button class="btn btn-sm btn-danger" data-del="' + t.id + '">删除</button></td>' +
            '</tr>'
        ).join('');
        tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(parseInt(b.dataset.edit))));
        tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(parseInt(b.dataset.del))));
    }

    function openModal(id) {
        editingId = id || null;
        $('modalTitle').textContent = id ? '编辑班次' : '新增班次';
        const t = id ? trips.find(x => x.id === id) : null;
        $('fShortName').value = t ? (t.tripShortName || '') : '';
        $('fDirection').value = t && t.directionId != null ? String(t.directionId) : '0';
        $('fHeadsign').value = t ? (t.tripHeadsign || '') : '';
        $('fServiceId').innerHTML = calendars.map(c => '<option value="' + esc(c.serviceId) + '">' + esc(c.serviceId) + '</option>').join('');
        $('fServiceId').value = t ? (t.serviceId || '') : (calendars[0] ? calendars[0].serviceId : '');
        $('fTripId').value = t ? t.tripId : genTripId(parseInt($('fDirection').value));
        $('fTripId').readOnly = true;
        $('modal').style.display = '';
        $('fDirection').focus();
    }

    function closeModal() { $('modal').style.display = 'none'; }

    async function save() {
        const tripId = $('fTripId').value.trim();
        const serviceId = $('fServiceId').value;
        if (!tripId) { toast('班次 ID 不能为空', true); return; }
        if (!serviceId) { toast('请选择服务日历', true); return; }
        const body = {
            tripShortName: $('fShortName').value.trim() || null,
            directionId: parseInt($('fDirection').value),
            tripHeadsign: $('fHeadsign').value.trim() || null,
            serviceId: serviceId
        };
        try {
            if (editingId) {
                await api('/api/trips/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已更新班次');
            } else {
                if (!routePk) { toast('缺少线路参数，请从线路列表进入', true); return; }
                await api('/api/trips', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ routeId: parseInt(routePk), tripId: tripId }, body)) });
                toast('已新增班次');
            }
            closeModal();
            await load();
        } catch (err) { toast('保存失败：' + err.message, true); }
    }

    async function remove(id) {
        const t = trips.find(x => x.id === id);
        if (!t) return;
        if (!confirm('确定删除班次「' + (t.tripShortName || t.tripId) + '」？此操作不可恢复。')) return;
        try {
            await api('/api/trips/' + id, { method: 'DELETE' });
            toast('已删除班次');
            await load();
        } catch (err) { toast('删除失败：' + err.message, true); }
    }

    $('btnAdd').addEventListener('click', () => openModal(null));
    $('fDirection').addEventListener('change', () => {
        if (!editingId) $('fTripId').value = genTripId(parseInt($('fDirection').value));
    });
    $('btnCancel').addEventListener('click', closeModal);
    $('btnSave').addEventListener('click', save);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').style.display !== 'none') closeModal(); });

    load();
</script>
</body>
</html>
