<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>司机维护 - 班车调度管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
        #app { display: flex; flex-direction: column; height: 100%; background: #f5f6f8; }

        /* ---------- 顶部导航栏（三页共用的统一外壳） ---------- */
        .appbar {
            display: flex; align-items: center; justify-content: space-between;
            height: 52px; padding: 0 20px; flex-shrink: 0;
            background: #fff; border-bottom: 1px solid #e0e3e8;
            box-shadow: 0 1px 2px rgba(0,0,0,.04);
        }
        .appbar-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 600; color: #202124; }
        .appbar-brand .logo {
            width: 28px; height: 28px; border-radius: 7px;
            background: linear-gradient(135deg, #1a73e8, #4f8ff7);
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 700;
        }
        .appbar-nav { display: flex; gap: 4px; }
        .appbar-tab {
            padding: 7px 15px; font-size: 13px; color: #5f6368; text-decoration: none;
            border-radius: 7px; transition: background .15s, color .15s;
        }
        .appbar-tab:hover { background: #f1f3f4; color: #202124; }
        .appbar-tab.active { background: #e8f0fe; color: #1a73e8; font-weight: 600; }

        /* ---------- 内容区 ---------- */
        #main { flex: 1; overflow: auto; padding: 24px 32px; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .toolbar h2 { font-size: 18px; font-weight: 600; color: #202124; }
        .toolbar .sub { font-size: 12px; color: #9aa0a6; margin-top: 2px; }
        .toolbar-right { display: flex; align-items: center; gap: 10px; }
        .search { padding: 7px 10px; font-size: 13px; border: 1px solid #d0d5dd; border-radius: 6px; background: #fff; width: 220px; }
        .search:focus { outline: 2px solid #aecbfa; border-color: #1a73e8; }
        button {
            padding: 7px 14px; font-size: 13px; border: 1px solid #d0d5dd; border-radius: 6px;
            background: #fff; color: #333; cursor: pointer; font-family: inherit;
        }
        button:hover { background: #f1f3f4; }
        button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
        button.primary:hover { background: #1765cc; }
        button.danger { color: #d93025; border-color: #f1c7c3; }
        button.danger:hover { background: #fce8e6; }
        button.mini { padding: 4px 10px; font-size: 12px; }

        /* ---------- 表格 ---------- */
        .card { background: #fff; border: 1px solid #e0e3e8; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th {
            text-align: left; padding: 11px 14px; background: #fafbfc; color: #5f6368;
            font-weight: 600; font-size: 12px; border-bottom: 1px solid #e0e3e8; white-space: nowrap;
        }
        tbody td { padding: 11px 14px; border-bottom: 1px solid #f0f2f5; color: #333; }
        tbody tr:hover { background: #f8fafd; }
        tbody tr:last-child td { border-bottom: none; }
        .name { font-weight: 600; color: #202124; }
        .muted { color: #9aa0a6; }
        .badge-num { display: inline-block; min-width: 20px; text-align: center; padding: 1px 7px; border-radius: 10px; font-size: 11px; background: #eef3fd; color: #174ea6; }
        .badge-num.zero { background: #f1f3f4; color: #9aa0a6; }
        .empty { padding: 40px; text-align: center; color: #9aa0a6; }

        /* ---------- 弹窗 ---------- */
        .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal { width: 380px; background: #fff; border-radius: 12px; padding: 20px 22px; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
        .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #202124; }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 4px; }
        .field input {
            width: 100%; padding: 7px 9px; font-size: 13px; border: 1px solid #d0d5dd; border-radius: 6px; background: #fff;
        }
        .field input:focus { outline: 2px solid #aecbfa; border-color: #1a73e8; }
        .modal .btn-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

        #toast {
            position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
            background: #202124; color: #fff; font-size: 13px; padding: 9px 18px;
            border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 9999;
        }
        #toast.show { opacity: .95; }
        #toast.err { background: #b3261e; }
    </style>
</head>
<body>
<div id="app">
    <header class="appbar">
        <div class="appbar-brand"><span class="logo">班</span><span>班车调度管理</span></div>
        <nav class="appbar-nav">
            <a class="appbar-tab" href="stops.html">站点维护</a>
            <a class="appbar-tab" href="map.html">线路描图</a>
            <a class="appbar-tab" href="vehicles.html">车辆</a>
            <a class="appbar-tab active" href="drivers.html">司机</a>
        </nav>
    </header>

    <div id="main">
        <div class="toolbar">
            <div>
                <h2>司机维护</h2>
                <div class="sub">司机姓名与手机号台账</div>
            </div>
            <div class="toolbar-right">
                <input type="text" class="search" id="searchInput" placeholder="搜索姓名 / 手机号…">
                <button id="btnAdd" class="primary">＋ 新增司机</button>
            </div>
        </div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>司机姓名</th><th>手机号</th><th>关联车辆</th><th style="width:130px">操作</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal" class="modal-mask" style="display:none">
    <div class="modal">
        <h3 id="modalTitle">新增司机</h3>
        <div class="field">
            <label>司机姓名 *</label>
            <input type="text" id="fName" maxlength="50" placeholder="如 宋永建">
        </div>
        <div class="field">
            <label>手机号</label>
            <input type="text" id="fPhone" maxlength="20" placeholder="如 13439306770">
        </div>
        <div class="btn-row">
            <button id="btnCancel">取消</button>
            <button id="btnSave" class="primary">保存</button>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="js/map-common.js"></script>
<script>
    const API = { drivers: '/api/drivers', vehicles: '/api/vehicles' };

    let drivers = [];
    let vehicles = [];
    let editingId = null;

    async function load() {
        try {
            const [d, v] = await Promise.all([api(API.drivers), api(API.vehicles)]);
            drivers = d || [];
            vehicles = v || [];
            render();
        } catch (err) { toast('加载失败：' + err.message, true); }
    }

    function vehicleCount(driverId) {
        return vehicles.filter(v => v.driverId === driverId).length;
    }

    function render() {
        const kw = $('searchInput').value.trim().toLowerCase();
        const list = drivers.filter(d => {
            if (!kw) return true;
            return ((d.name || '') + ' ' + (d.phone || '')).toLowerCase().includes(kw);
        });
        const tbody = $('tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty">暂无司机数据</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(d => {
            const n = vehicleCount(d.id);
            return '<tr>' +
                '<td class="name">' + esc(d.name) + '</td>' +
                '<td class="muted">' + esc(d.phone || '-') + '</td>' +
                '<td><span class="badge-num' + (n === 0 ? ' zero' : '') + '">' + n + '</span></td>' +
                '<td><button class="mini" data-edit="' + d.id + '">编辑</button> ' +
                '<button class="mini danger" data-del="' + d.id + '">删除</button></td>' +
                '</tr>';
        }).join('');
        tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(parseInt(b.dataset.edit))));
        tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(parseInt(b.dataset.del))));
    }

    function openModal(id) {
        editingId = id || null;
        $('modalTitle').textContent = id ? '编辑司机' : '新增司机';
        const d = id ? drivers.find(x => x.id === id) : null;
        $('fName').value = d ? (d.name || '') : '';
        $('fPhone').value = d ? (d.phone || '') : '';
        $('modal').style.display = '';
        $('fName').focus();
    }

    function closeModal() { $('modal').style.display = 'none'; }

    async function save() {
        const name = $('fName').value.trim();
        if (!name) { toast('司机姓名不能为空', true); return; }
        const body = { name: name, phone: $('fPhone').value.trim() || null };
        try {
            if (editingId) {
                await api(API.drivers + '/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已更新：' + name);
            } else {
                await api(API.drivers, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已新增：' + name);
            }
            closeModal();
            await load();
        } catch (err) { toast('保存失败：' + err.message, true); }
    }

    async function remove(id) {
        const d = drivers.find(x => x.id === id);
        if (!d) return;
        const n = vehicleCount(id);
        if (n > 0) {
            toast('该司机仍关联 ' + n + ' 辆车，请先在「车辆」页解除关联', true);
            return;
        }
        if (!confirm('确定删除司机「' + d.name + '」？此操作不可恢复。')) return;
        try {
            await api(API.drivers + '/' + id, { method: 'DELETE' });
            toast('已删除：' + d.name);
            await load();
        } catch (err) { toast('删除失败：' + err.message, true); }
    }

    $('searchInput').addEventListener('input', render);
    $('btnAdd').addEventListener('click', () => openModal(null));
    $('btnCancel').addEventListener('click', closeModal);
    $('btnSave').addEventListener('click', save);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').style.display !== 'none') closeModal(); });

    load();
</script>
</body>
</html>
