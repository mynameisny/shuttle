<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆档案 · 班车调度管理</title>
    <meta name="nav" content="vehicles.archives">
    <link rel="stylesheet" href="css/app.css">
    <script>try{if(localStorage.getItem('shuttle.sidebar.collapsed')==='1')document.documentElement.classList.add('sb-collapsed');}catch(e){}</script>
    <style>
        /* 页面特异性样式：仅车辆页使用的部分 */
        .fleet-summary {
            display: flex;
            align-items: center;
            gap: 0;
            padding: 0 18px;
            border-bottom: 1px solid var(--c-border);
            overflow-x: auto;
        }
        .fleet-summary .fs-item {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 12px 20px 12px 0;
            margin-right: 20px;
            border-right: 1px solid #f1f3f6;
            white-space: nowrap;
        }
        .fleet-summary .fs-item:last-child { border-right: none; }
        .fleet-summary .fs-label { font-size: 11px; color: var(--c-text-3); }
        .fleet-summary .fs-value { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
        .plate-cell { font-weight: 620; letter-spacing: .02em; }
        .expiry-soon { color: var(--c-warn); font-weight: 600; }
        .expiry-over { color: var(--c-danger); font-weight: 600; }

        /* 列设置下拉面板 */
        .cols-wrap { position: relative; }
        .col-panel {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            z-index: 60;
            min-width: 190px;
            background: #fff;
            border: 1px solid var(--c-border);
            border-radius: 8px;
            box-shadow: var(--shadow-2);
            padding: 6px;
        }
        .col-panel .cp-title {
            font-size: 11px; font-weight: 700; letter-spacing: .05em;
            text-transform: uppercase; color: var(--c-text-3);
            padding: 4px 8px 6px;
        }
        .col-panel .cp-item {
            display: flex; align-items: center; gap: 8px;
            padding: 6px 8px; border-radius: 6px;
            font-size: 12.5px; color: var(--c-text-2);
            cursor: pointer; user-select: none;
        }
        .col-panel .cp-item:hover { background: #f7f8fa; }
        .col-panel .cp-item input { margin: 0; accent-color: var(--c-primary); }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page" id="page">

            <div class="page-head">
                <div>
                    <div class="crumbs" data-auto-crumbs></div>
                    <h1 class="page-title">车辆档案</h1>
                    <p class="page-desc">车牌、VIN、品牌/车系/款型、座位、能源、状态与保险年检台账</p>
                </div>
                <div class="page-actions">
                    <label class="search-wrap">
                        <svg class="ico" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.4"/><path d="M13 13l3.4 3.4"/></svg>
                        <input type="text" class="search" id="searchInput" placeholder="搜索车牌 / 品牌 / 车系 / 供应商…" style="width:250px">
                    </label>
                    <div class="cols-wrap">
                        <button class="btn" id="btnCols" title="设置显示列">
                            <svg class="ico" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 9h14M3 14h14M9.5 4v13M14.5 4v13"/></svg>
                            列设置
                        </button>
                        <div class="col-panel" id="colPanel" style="display:none"></div>
                    </div>
                    <button class="btn btn-primary" id="btnAdd">
                        <svg class="ico" viewBox="0 0 20 20"><path d="M10 4.2v11.6M4.2 10h11.6"/></svg>
                        新增车辆
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="fleet-summary" id="fleetSummary"></div>
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr id="theadRow"></tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="modal" class="modal-mask" style="display:none">
    <div class="modal">
        <h3 id="modalTitle">新增车辆</h3>
        <p class="modal-desc">车牌号唯一，保存后可在列表与工作台统计中生效</p>
        <div class="field">
            <label>车牌号<span class="req">*</span></label>
            <input type="text" class="input" id="fPlate" maxlength="20" placeholder="如 京B12345D">
        </div>
        <div class="field-row">
            <div class="field">
                <label>VIN（车辆识别代号）</label>
                <input type="text" class="input" id="fVin" maxlength="50" placeholder="如 LSKK69A8XA1234567">
            </div>
            <div class="field">
                <label>发动机号 / 电机号</label>
                <input type="text" class="input" id="fEngine" maxlength="50" placeholder="如 YCS04230-52">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>品牌</label>
                <input type="text" class="input" id="fBrand" maxlength="50" placeholder="如 宇通 / 比亚迪 / 丰田">
            </div>
            <div class="field">
                <label>车系</label>
                <input type="text" class="input" id="fSeries" maxlength="50" placeholder="如 海格 / 唐 / 卡罗拉">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>款型</label>
                <input type="text" class="input" id="fModel" maxlength="100" placeholder="如 2023款 纯电动 豪华版">
            </div>
            <div class="field">
                <label>座位数</label>
                <input type="number" class="input" id="fSeat" min="1" max="200" placeholder="如 48">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>车型</label>
                <select class="select" id="fType">
                    <option value="大巴">大巴</option>
                    <option value="中巴">中巴</option>
                    <option value="考斯特">考斯特</option>
                </select>
            </div>
            <div class="field">
                <label>能源类型</label>
                <select class="select" id="fEnergy">
                    <option value="">未填写</option>
                    <option value="燃油">燃油</option>
                    <option value="纯电">纯电</option>
                    <option value="混动">混动</option>
                </select>
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>车辆状态</label>
                <select class="select" id="fStatus">
                    <option value="运营中">运营中</option>
                    <option value="维修">维修</option>
                    <option value="停运">停运</option>
                </select>
            </div>
            <div class="field">
                <label>供应商</label>
                <input type="text" class="input" id="fSupplier" maxlength="50" placeholder="如 新朗途 / 驰锐">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>保险到期日</label>
                <input type="date" class="input" id="fInsurance">
            </div>
            <div class="field">
                <label>年检到期日</label>
                <input type="date" class="input" id="fInspection">
            </div>
        </div>
        <div class="btn-row">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    initShell();

    const API = { vehicles: '/api/vehicles' };
    let vehicles = [];
    let editingId = null;

    async function load() {
        try {
            vehicles = await api(API.vehicles) || [];
            renderSummary();
            render();
        } catch (err) { toast('加载失败：' + err.message, true); }
    }

    function typePill(t) {
        const cls = t === '大巴' ? 'pill-info' : t === '中巴' ? 'pill-warn' : 'pill-neutral';
        return '<span class="pill no-dot ' + cls + '">' + esc(t || '-') + '</span>';
    }
    function statusPill(s) {
        const cls = s === '维修' ? 'pill-warn' : s === '停运' ? 'pill-danger' : 'pill-ok';
        return '<span class="pill ' + cls + '">' + esc(s || '运营中') + '</span>';
    }

    // 到期日着色：逾期红、60 天内橙
    function expiryCell(d) {
        if (!d) return '<span class="muted">—</span>';
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const dt = new Date(d + 'T00:00:00');
        const days = Math.round((dt - today) / 86400000);
        let cls = '';
        if (days < 0) cls = 'expiry-over';
        else if (days <= 60) cls = 'expiry-soon';
        return '<span class="mono ' + cls + '">' + esc(d) + '</span>';
    }

    // ===== 列配置：key 用于持久化隐藏状态；required 列不可隐藏；cell(v) 返回整格 <td> =====
    const COLUMNS = [
        { key: 'plateNumber', label: '车牌号', required: true, cell: v =>
            '<td><div class="cell-stack"><span class="plate-cell">' + esc(v.plateNumber) + '</span>' +
            '<span class="sub">ID ' + v.id + '</span></div></td>' },
        { key: 'brand', label: '品牌 / 车系 / 款型', cell: v =>
            '<td>' + (v.brand || v.series || v.model
                ? '<div class="cell-stack"><span>' + esc(v.brand || '—') + (v.series ? ' ' + esc(v.series) : '') + '</span>' +
                  '<span class="sub">' + esc(v.model || '—') + '</span></div>'
                : '<span class="muted">未填写</span>') + '</td>' },
        { key: 'vin', label: 'VIN / 发动机号', cell: v =>
            '<td>' + (v.vin || v.engineNumber
                ? '<div class="cell-stack"><span class="mono">' + esc(v.vin || '—') + '</span>' +
                  '<span class="sub mono">' + esc(v.engineNumber || '—') + '</span></div>'
                : '<span class="muted">—</span>') + '</td>' },
        { key: 'vehicleType', label: '车型', cell: v => '<td>' + typePill(v.vehicleType) + '</td>' },
        { key: 'seatCount', label: '座位', cell: v => '<td class="mono">' + (v.seatCount != null ? v.seatCount : '<span class="muted">—</span>') + '</td>' },
        { key: 'energyType', label: '能源', cell: v => '<td>' + (v.energyType ? esc(v.energyType) : '<span class="muted">—</span>') + '</td>' },
        { key: 'status', label: '状态', cell: v => '<td>' + statusPill(v.status) + '</td>' },
        { key: 'supplier', label: '供应商', cell: v => '<td>' + (v.supplier ? esc(v.supplier) : '<span class="muted">—</span>') + '</td>' },
        { key: 'insuranceExpiry', label: '保险到期', cell: v => '<td>' + expiryCell(v.insuranceExpiry) + '</td>' },
        { key: 'inspectionExpiry', label: '年检到期', cell: v => '<td>' + expiryCell(v.inspectionExpiry) + '</td>' },
        { key: 'actions', label: '操作', required: true, cell: v =>
            '<td class="col-actions"><button class="btn btn-sm" data-edit="' + v.id + '">编辑</button> ' +
            '<button class="btn btn-sm btn-danger" data-del="' + v.id + '">删除</button></td>' }
    ];

    const COL_KEY = 'shuttle.vehicles.hiddenCols';
    // 首次访问默认隐藏：VIN/发动机号、保险到期、年检到期（次要信息默认收起，可勾选展开）
    const DEFAULT_HIDDEN = ['vin', 'insuranceExpiry', 'inspectionExpiry'];
    let hiddenCols = [];
    try {
        const stored = localStorage.getItem(COL_KEY);
        hiddenCols = stored ? JSON.parse(stored) : DEFAULT_HIDDEN.slice();
    } catch (e) { hiddenCols = DEFAULT_HIDDEN.slice(); }

    function visibleColumns() {
        return COLUMNS.filter(c => c.required || hiddenCols.indexOf(c.key) === -1);
    }

    function renderSummary() {
        const total = vehicles.length;
        const running = vehicles.filter(v => (v.status || '运营中') === '运营中').length;
        const maintain = vehicles.filter(v => v.status === '维修').length;
        const out = vehicles.filter(v => v.status === '停运').length;
        const seats = vehicles.reduce((s, v) => s + (v.seatCount || 0), 0);
        $('fleetSummary').innerHTML =
            '<div class="fs-item"><span class="fs-label">车辆总数</span><span class="fs-value">' + total + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">运营中</span><span class="fs-value" style="color:var(--c-ok)">' + running + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">维修</span><span class="fs-value" style="color:var(--c-warn)">' + maintain + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">停运</span><span class="fs-value" style="color:var(--c-danger)">' + out + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">总座位</span><span class="fs-value">' + seats + '</span></div>';
    }

    function render() {
        const cols = visibleColumns();
        $('theadRow').innerHTML = cols.map(c =>
            '<th' + (c.key === 'actions' ? ' class="col-actions"' : '') + '>' + c.label + '</th>'
        ).join('');
        const kw = $('searchInput').value.trim().toLowerCase();
        const list = vehicles.filter(v => {
            if (!kw) return true;
            const hay = [v.plateNumber, v.vin, v.brand, v.series, v.model, v.engineNumber, v.supplier]
                .filter(Boolean).join(' ');
            return hay.toLowerCase().includes(kw);
        });
        const tbody = $('tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="' + cols.length + '">' +
                '<div class="empty-state"><div class="em-title">没有匹配的车辆</div>' +
                '<div class="em-desc">换个关键词，或点击右上角「新增车辆」录入</div></div></td></tr>';
            return;
        }
        tbody.innerHTML = list.map(v => '<tr>' + cols.map(c => c.cell(v)).join('') + '</tr>').join('');
        tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(parseInt(b.dataset.edit))));
        tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(parseInt(b.dataset.del))));
    }

    // 列设置面板：渲染可隐藏列的 checkbox，切换即持久化并重渲染
    function renderColPanel() {
        $('colPanel').innerHTML =
            '<div class="cp-title">显示列</div>' +
            COLUMNS.filter(c => !c.required).map(c =>
                '<label class="cp-item"><input type="checkbox" data-col="' + c.key + '"' +
                (hiddenCols.indexOf(c.key) === -1 ? ' checked' : '') + '> ' + esc(c.label) + '</label>'
            ).join('');
        $('colPanel').querySelectorAll('input[data-col]').forEach(cb => {
            cb.addEventListener('change', () => {
                const key = cb.dataset.col;
                if (cb.checked) hiddenCols = hiddenCols.filter(k => k !== key);
                else if (hiddenCols.indexOf(key) === -1) hiddenCols.push(key);
                localStorage.setItem(COL_KEY, JSON.stringify(hiddenCols));
                render();
            });
        });
    }

    function openModal(id) {
        editingId = id || null;
        $('modalTitle').textContent = id ? '编辑车辆' : '新增车辆';
        const v = id ? vehicles.find(x => x.id === id) : null;
        $('fPlate').value = v ? v.plateNumber : '';
        $('fVin').value = v ? (v.vin || '') : '';
        $('fEngine').value = v ? (v.engineNumber || '') : '';
        $('fBrand').value = v ? (v.brand || '') : '';
        $('fSeries').value = v ? (v.series || '') : '';
        $('fModel').value = v ? (v.model || '') : '';
        $('fSeat').value = v && v.seatCount != null ? v.seatCount : '';
        $('fType').value = v && v.vehicleType ? v.vehicleType : '大巴';
        $('fEnergy').value = v && v.energyType ? v.energyType : '';
        $('fStatus').value = v && v.status ? v.status : '运营中';
        $('fSupplier').value = v ? (v.supplier || '') : '';
        $('fInsurance').value = v ? (v.insuranceExpiry || '') : '';
        $('fInspection').value = v ? (v.inspectionExpiry || '') : '';
        $('modal').style.display = '';
        $('fPlate').focus();
    }

    function closeModal() { $('modal').style.display = 'none'; }

    async function save() {
        const plate = $('fPlate').value.trim();
        if (!plate) { toast('车牌号不能为空', true); return; }
        const body = {
            plateNumber: plate,
            vin: $('fVin').value.trim() || null,
            brand: $('fBrand').value.trim() || null,
            series: $('fSeries').value.trim() || null,
            model: $('fModel').value.trim() || null,
            engineNumber: $('fEngine').value.trim() || null,
            seatCount: $('fSeat').value ? parseInt($('fSeat').value) : null,
            vehicleType: $('fType').value,
            energyType: $('fEnergy').value || null,
            status: $('fStatus').value || '运营中',
            supplier: $('fSupplier').value.trim() || null,
            insuranceExpiry: $('fInsurance').value || null,
            inspectionExpiry: $('fInspection').value || null
        };
        try {
            if (editingId) {
                await api(API.vehicles + '/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已更新：' + plate);
            } else {
                await api(API.vehicles, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已新增：' + plate);
            }
            closeModal();
            await load();
        } catch (err) { toast('保存失败：' + err.message, true); }
    }

    async function remove(id) {
        const v = vehicles.find(x => x.id === id);
        if (!v) return;
        if (!confirm('确定删除车辆「' + v.plateNumber + '」？此操作不可恢复。')) return;
        try {
            await api(API.vehicles + '/' + id, { method: 'DELETE' });
            toast('已删除：' + v.plateNumber);
            await load();
        } catch (err) { toast('删除失败：' + err.message, true); }
    }

    $('searchInput').addEventListener('input', render);
    $('btnAdd').addEventListener('click', () => openModal(null));
    $('btnCancel').addEventListener('click', closeModal);
    $('btnSave').addEventListener('click', save);
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    $('btnCols').addEventListener('click', e => {
        e.stopPropagation();
        const p = $('colPanel');
        if (p.style.display === 'none') { renderColPanel(); p.style.display = ''; }
        else p.style.display = 'none';
    });
    document.addEventListener('click', e => {
        const wrap = document.querySelector('.cols-wrap');
        if (wrap && !wrap.contains(e.target)) $('colPanel').style.display = 'none';
    });
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            if ($('modal').style.display !== 'none') closeModal();
            $('colPanel').style.display = 'none';
        }
    });

    load();
</script>
</body>
</html>
