name: Sync from Gitee (Private Repo)

on:
  # 每5分钟自动同步一次（UTC时间）
  schedule:
    - cron: '*/5 * * * *'
  
  # 允许手动触发（用于测试）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private Gitee repository
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          # 使用 Gitee Personal Access Token 克隆私有仓库
          git clone https://oauth2:${GITEE_TOKEN}@gitee.com/mynameisny/shuttle.git .
          git checkout develop

      - name: Push to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 配置 Git 用户信息（必须，否则 push 会失败）
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 将远程 origin 指向 GitHub（使用 Classic PAT）
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/mynameisny/shuttle.git

          # 强制推送，确保 GitHub 与 Gitee 完全一致
          git push origin develop --force
