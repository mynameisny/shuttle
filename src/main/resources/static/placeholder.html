<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>功能建设中 · 班车调度管理</title>
    <meta name="nav" content="">
    <link rel="stylesheet" href="css/app.css">
    <style>
        .ph-wrap {
            max-width: 720px;
            margin: 6vh auto 0;
            text-align: center;
        }
        .ph-ico {
            width: 62px; height: 62px; margin: 0 auto 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, #e9fbf8, #d8f4ef);
            border: 1px solid #cdeee9;
            display: flex; align-items: center; justify-content: center;
        }
        .ph-ico .ico { width: 28px; height: 28px; stroke: var(--c-primary-ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .ph-title { font-size: 20px; font-weight: 650; margin-bottom: 7px; }
        .ph-desc { font-size: 13px; color: var(--c-text-2); line-height: 1.7; margin-bottom: 20px; }
        .ph-note {
            display: inline-block;
            max-width: 100%;
            background: #fff;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            padding: 14px 18px;
            text-align: left;
            font-size: 12.5px;
            color: var(--c-text-2);
            line-height: 1.75;
            box-shadow: var(--shadow-1);
        }
        .ph-note b { color: var(--c-text); font-weight: 600; }
        .ph-actions { margin-top: 22px; display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page">
            <div class="ph-wrap">
                <div class="ph-ico" id="phIcon"></div>
                <h1 class="ph-title" id="phTitle">功能建设中</h1>
                <p class="ph-desc" id="phDesc">该模块的菜单与信息架构已就位，业务能力尚待实现。</p>
                <div class="ph-note" id="phNote"></div>
                <div class="ph-actions">
                    <a class="btn" href="dashboard.html">返回工作台</a>
                    <a class="btn btn-primary" href="routes.html">先去线路台账</a>
                </div>
                <p style="margin-top:18px;font-size:11.5px;color:var(--c-text-3)">
                    建议下一步：先完善线路 × 班次 × 车辆的关联，再逐步补齐运营记录。
                </p>
            </div>
        </div>
    </div>
</div>
<div id="toast"></div>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    // 根据 ?m=<navKey> 找到菜单定义，渲染占位内容
    (function () {
        const key = new URLSearchParams(location.search).get('m') || '';

        // 临时把 nav 换成占位页要显示的 key，以便侧边栏正确高亮
        document.querySelector('meta[name="nav"]').content = key;
        initShell();

        let found = null;
        MENU.forEach(sec => sec.items.forEach(it => {
            if (it.key === key) found = { name: it.name, note: it.note, icon: it.icon, group: sec.group };
            if (it.children) it.children.forEach(c => {
                if (c.key === key) found = { name: c.name, note: c.note, icon: it.icon, group: sec.group, parent: it.name };
            });
        }));

        const name = found ? found.name : '未知模块';
        const parent = found && found.parent ? found.parent : '';
        const note = found && found.note ? found.note : '该功能的业务范围尚待确认。';
        const icon = found && found.icon ? found.icon : 'inBox';

        // 面包屑
        const crumbs = document.createElement('div');
        crumbs.className = 'crumbs';
        crumbs.style.cssText = 'justify-content:center;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-text-3);margin-bottom:14px';
        crumbs.innerHTML = '<a href="dashboard.html">工作台</a><span class="sep">/</span>' +
            (found && found.group ? '<span>' + esc(found.group) + '</span><span class="sep">/</span>' : '') +
            (parent ? '<span>' + esc(parent) + '</span><span class="sep">/</span>' : '') +
            '<span class="cur" style="color:var(--c-text-2)">' + esc(name) + '</span>';
        document.querySelector('.ph-wrap').insertBefore(crumbs, document.querySelector('.ph-ico'));

        document.title = name + ' · 建设中的功能 · 班车调度管理';
        document.getElementById('phTitle').textContent = name;
        document.getElementById('phDesc').textContent = '该模块的菜单与信息架构已就位，业务能力尚待实现。';
        document.getElementById('phIcon').innerHTML = iconSvg(icon);
        document.getElementById('phNote').innerHTML =
            '<b>规划范围：</b>' + esc(note) + '<br>' +
            '<b>当前状态：</b>菜单已占位，后端尚无对应实体与接口。<br>' +
            '<b>说明：</b>本系统 GTFS 数据（线路 / 班次 / 站点 / 时刻）已可用，可在「线路管理」中维护。';
    })();
</script>
</body>
</html>
