<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班车线路 · 班车调度管理</title>
    <meta name="nav" content="routes.list">
    <link rel="stylesheet" href="css/app.css">
    <script>try{if(localStorage.getItem('shuttle.sidebar.collapsed')==='1')document.documentElement.classList.add('sb-collapsed');}catch(e){}</script>
    <style>
        .route-chip {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 30px; height: 22px; padding: 0 7px;
            border-radius: 5px; font-size: 11.5px; font-weight: 650;
            color: #fff; font-variant-numeric: tabular-nums;
        }
        .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; vertical-align: middle; }
        .drag-cell { width: 32px; text-align: center; cursor: grab; }
        .drag-handle {
            display: inline-flex; align-items: center; justify-content: center;
            color: #c3c9d1; user-select: none;
        }
        .drag-handle .ico { width: 14px; height: 14px; fill: currentColor; }
        .drag-cell:hover .drag-handle { color: var(--c-text-3); }
        .color-input { display: flex; align-items: center; gap: 8px; }
        .color-input input[type="color"] {
            width: 44px; height: 34px; padding: 0; flex-shrink: 0;
            border: 1px solid var(--c-border-strong); border-radius: var(--radius-sm);
            background: #fff; cursor: pointer;
        }
        .stat-strip { display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--c-border); overflow-x: auto; }
        .stat-strip .fs-item {
            display: flex; flex-direction: column; gap: 1px;
            padding: 12px 20px 12px 0; margin-right: 20px;
            border-right: 1px solid #f1f3f6; white-space: nowrap;
        }
        .stat-strip .fs-item:last-child { border-right: none; }
        .stat-strip .fs-label { font-size: 11px; color: var(--c-text-3); }
        .stat-strip .fs-value { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page">

            <div class="page-head">
                <div>
                    <div class="crumbs" data-auto-crumbs></div>
                    <h1 class="page-title">班车线路</h1>
                    <p class="page-desc">GTFS 线路台账 · 站点与运行方向维护入口</p>
                </div>
                <div class="page-actions">
                    <label class="search-wrap">
                        <svg class="ico" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.4"/><path d="M13 13l3.4 3.4"/></svg>
                        <input type="text" class="search" id="searchInput" placeholder="搜索线路名称 / 编号…" style="width:250px">
                    </label>
                    <button class="btn btn-primary" id="btnAdd">新增线路</button>
                    <a class="btn" href="stops.html">站点维护</a>
                    <a class="btn" href="map.html">线路描图</a>
                </div>
            </div>

            <div class="card">
                <div class="stat-strip" id="statStrip"></div>
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th style="width:32px"></th>
                            <th style="width:74px">线路号</th>
                            <th>线路名称</th>
                            <th>起点标注</th>
                            <th>类型</th>
                            <th>颜色</th>
                            <th class="col-actions">操作</th>
                        </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="modal" class="modal-mask" style="display:none">
    <div class="modal">
        <h3 id="modalTitle">新增线路</h3>
        <p class="modal-desc">线路 ID 唯一，对应 GTFS routes.txt</p>
        <div class="field-row">
            <div class="field">
                <label>所属机构<span class="req">*</span></label>
                <select class="select" id="fAgency"></select>
            </div>
            <div class="field">
                <label>线路 ID<span class="req">*</span></label>
                <input type="text" class="input" id="fRouteId" maxlength="50" placeholder="如 42">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>线路名称<span class="req">*</span></label>
                <input type="text" class="input" id="fLongName" maxlength="100" placeholder="如 天通苑-昌平">
            </div>
            <div class="field">
                <label>简称 / 起点标注</label>
                <input type="text" class="input" id="fShortName" maxlength="255" placeholder="如 天通苑">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>线路类型<span class="req">*</span></label>
                <select class="select" id="fRouteType"></select>
            </div>
            <div class="field">
                <label>线路颜色</label>
                <div class="color-input">
                    <input type="color" id="fColorPicker" value="#1a73e8">
                    <input type="text" class="input" id="fColor" maxlength="25" placeholder="#1a73e8 或 26,115,232">
                </div>
            </div>
        </div>
        <div class="field">
            <label>排序</label>
            <input type="number" class="input" id="fSortOrder" min="0" placeholder="数字越小越靠前，可留空">
        </div>
        <div class="btn-row">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<div id="toast"></div>
<script src="vendor/sortablejs/Sortable.min.js"></script>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    initShell();

    let routes = [];
    let agencies = [];
    let editingId = null;

    const ROUTE_TYPES = [
        { value: 'BUS', label: '公交' },
        { value: 'SUBWAY', label: '地铁' },
        { value: 'TRAM', label: '有轨电车' },
        { value: 'RAIL', label: '铁路' },
        { value: 'FERRY', label: '轮渡' },
        { value: 'TROLLEYBUS', label: '无轨电车' },
        { value: 'MONORAIL', label: '单轨' }
    ];

    // 颜色解析：支持 #1a73e8 / 1a73e8 / abc / rgb(26,115,232) / 26,115,232，返回 6 位大写 hex
    function parseColorToHex(str) {
        str = (str || '').trim();
        if (!str) return null;
        str = str.replace(/^#/, '');
        if (/^[0-9a-fA-F]{6}$/.test(str)) return str.toUpperCase();
        if (/^[0-9a-fA-F]{3}$/.test(str)) return str.split('').map(c => c + c).join('').toUpperCase();
        const m = str.match(/^(?:rgba?\(?\s*)?(\d{1,3})\s*[, ]\s*(\d{1,3})\s*[, ]\s*(\d{1,3})/);
        if (m) {
            return [m[1], m[2], m[3]].map(v => Math.min(255, parseInt(v)).toString(16).padStart(2, '0')).join('').toUpperCase();
        }
        return null;
    }

    async function load() {
        try {
            const [a, r] = await Promise.all([
                api('/api/agencies'),
                api('/api/routes')
            ]);
            agencies = a || [];
            routes = r || [];
            renderStrip();
            render();
        } catch (err) { toast('加载失败：' + err.message, true); }
    }

    function renderStrip() {
        const total = routes.length;
        const withColor = routes.filter(r => r.routeColor).length;
        $('statStrip').innerHTML =
            '<div class="fs-item"><span class="fs-label">线路总数</span><span class="fs-value">' + total + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">已设线路色</span><span class="fs-value">' + withColor + '</span></div>' +
            '<div class="fs-item"><span class="fs-label">线路类型</span><span class="fs-value" style="font-size:13px">BUS 公交</span></div>';
    }

    function sortKey(r) {
        if (r.routeSortOrder != null) return r.routeSortOrder;
        const n = parseInt(r.routeId);
        return isNaN(n) ? 9999 : n;
    }

    function render() {
        const kw = $('searchInput').value.trim().toLowerCase();
        const list = routes
            .filter(r => {
                if (!kw) return true;
                return ((r.routeLongName || '') + ' ' + (r.routeShortName || '') + ' ' + r.routeId).toLowerCase().includes(kw);
            })
            .sort((a, b) => sortKey(a) - sortKey(b));

        const tbody = $('tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state">' +
                '<div class="em-title">没有匹配的线路</div><div class="em-desc">换个关键词试试</div></div></td></tr>';
            return;
        }

        tbody.innerHTML = list.map(r => {
            const color = r.routeColor ? '#' + String(r.routeColor).replace('#', '') : '#9aa3b0';
            const name = r.routeLongName || r.routeShortName || ('线路 ' + r.routeId);
            return '<tr data-id="' + r.id + '">' +
                '<td class="drag-cell"><span class="drag-handle"><svg class="ico" viewBox="0 0 20 20">' +
                '<circle cx="7" cy="4" r="1.4"/><circle cx="13" cy="4" r="1.4"/>' +
                '<circle cx="7" cy="10" r="1.4"/><circle cx="13" cy="10" r="1.4"/>' +
                '<circle cx="7" cy="16" r="1.4"/><circle cx="13" cy="16" r="1.4"/></svg></span></td>' +
                '<td><span class="route-chip" style="background:' + esc(color) + '">' + esc(r.routeId) + '</span></td>' +
                '<td class="strong">' + esc(name) + '</td>' +
                '<td>' + (r.routeShortName ? esc(r.routeShortName) : '<span class="muted">—</span>') + '</td>' +
                '<td><span class="pill no-dot pill-neutral">' + esc(r.routeType || 'BUS') + '</span></td>' +
                '<td><span class="color-dot" style="background:' + esc(color) + '"></span>' +
                ' <span class="mono muted" style="font-size:11.5px">' + esc(r.routeColor || '—') + '</span></td>' +
                '<td class="col-actions">' +
                '<button class="btn btn-sm" data-edit="' + r.id + '">编辑</button> ' +
                '<button class="btn btn-sm btn-danger" data-del="' + r.id + '">删除</button> ' +
                '<a class="btn btn-sm" href="stops.html?routePk=' + r.id + '">站点</a> ' +
                '<a class="btn btn-sm" href="map.html?routePk=' + r.id + '">描图</a></td>' +
                '</tr>';
        }).join('');
        tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(parseInt(b.dataset.edit))));
        tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(parseInt(b.dataset.del))));
    }

    function openModal(id) {
        editingId = id || null;
        $('modalTitle').textContent = id ? '编辑线路' : '新增线路';
        const r = id ? routes.find(x => x.id === id) : null;
        $('fAgency').innerHTML = agencies.map(a => '<option value="' + a.id + '">' + esc(a.agencyName || a.agencyId) + '</option>').join('');
        $('fAgency').value = r && r.agency ? String(r.agency.id) : (agencies[0] ? String(agencies[0].id) : '');
        $('fAgency').disabled = !!r;
        $('fRouteId').value = r ? r.routeId : '';
        $('fRouteId').readOnly = !!r;
        $('fLongName').value = r ? (r.routeLongName || '') : '';
        $('fShortName').value = r ? (r.routeShortName || '') : '';
        $('fRouteType').innerHTML = ROUTE_TYPES.map(t => '<option value="' + t.value + '">' + t.label + '</option>').join('');
        $('fRouteType').value = r && r.routeType ? r.routeType : 'BUS';
        const color = r ? (r.routeColor || '') : '';
        $('fColor').value = color ? '#' + color : '';
        $('fColorPicker').value = color ? '#' + color.toLowerCase() : '#1a73e8';
        $('fSortOrder').value = r && r.routeSortOrder != null ? r.routeSortOrder : '';
        $('modal').style.display = '';
        $('fRouteId').focus();
    }

    function closeModal() { $('modal').style.display = 'none'; }

    async function save() {
        const routeId = $('fRouteId').value.trim();
        const longName = $('fLongName').value.trim();
        const agencyId = $('fAgency').value;
        if (!routeId) { toast('线路 ID 不能为空', true); return; }
        if (!longName) { toast('线路名称不能为空', true); return; }
        if (!agencyId) { toast('请选择所属机构', true); return; }
        const color = parseColorToHex($('fColor').value);
        const body = {
            routeLongName: longName,
            routeShortName: $('fShortName').value.trim() || null,
            routeType: $('fRouteType').value,
            routeColor: color || null,
            routeSortOrder: $('fSortOrder').value ? parseInt($('fSortOrder').value) : null
        };
        try {
            if (editingId) {
                await api('/api/routes/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已更新：' + longName);
            } else {
                await api('/api/routes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ agencyId: parseInt(agencyId), routeId: routeId }, body)) });
                toast('已新增：' + longName);
            }
            closeModal();
            await load();
        } catch (err) { toast('保存失败：' + err.message, true); }
    }

    async function remove(id) {
        const r = routes.find(x => x.id === id);
        if (!r) return;
        if (!confirm('确定删除线路「' + (r.routeLongName || r.routeId) + '」？此操作不可恢复。')) return;
        try {
            await api('/api/routes/' + id, { method: 'DELETE' });
            toast('已删除：' + (r.routeLongName || r.routeId));
            await load();
        } catch (err) { toast('删除失败：' + err.message, true); }
    }

    $('searchInput').addEventListener('input', render);
    $('btnAdd').addEventListener('click', () => openModal(null));
    $('btnCancel').addEventListener('click', closeModal);
    $('btnSave').addEventListener('click', save);
    // 颜色双向联动：选色块 → 同步文本；输入文本 → 解析后同步色块
    $('fColorPicker').addEventListener('input', () => {
        $('fColor').value = $('fColorPicker').value.replace('#', '');
    });
    $('fColor').addEventListener('input', () => {
        const hex = parseColorToHex($('fColor').value);
        if (hex) $('fColorPicker').value = '#' + hex.toLowerCase();
    });
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').style.display !== 'none') closeModal(); });

    load();

    // 拖拽排序（SortableJS，通过手柄触发）
    new Sortable($('tbody'), {
        handle: '.drag-handle',
        animation: 150,
        onEnd: async () => {
            const orderedIds = [...$('tbody').querySelectorAll('tr[data-id]')].map(tr => parseInt(tr.dataset.id));
            if (!orderedIds.length) return;
            const byId = {};
            routes.forEach(r => { byId[r.id] = r; });
            routes = orderedIds.map(id => byId[id]).filter(Boolean);
            try {
                await api('/api/routes/sort', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(orderedIds) });
                toast('排序已保存');
            } catch (err) {
                toast('保存排序失败：' + err.message, true);
                await load();
            }
        }
    });
</script>
</body>
</html>
