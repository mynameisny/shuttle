<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车长管理 · 班车调度管理</title>
    <meta name="nav" content="captains">
    <link rel="stylesheet" href="css/app.css">
    <script>try{if(localStorage.getItem('shuttle.sidebar.collapsed')==='1')document.documentElement.classList.add('sb-collapsed');}catch(e){}</script>
    <style>
        .mono { font-variant-numeric: tabular-nums; }
        .gender-ico {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
            margin-right: 8px; vertical-align: middle;
        }
        .gender-ico svg {
            width: 11px; height: 11px; fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .gender-m { background: var(--c-info-soft); color: var(--c-info); }
        .gender-f { background: #fdeef4; color: #d63384; }
        .gender-none { background: #f1f3f5; color: var(--c-text-3); }
        /* 防窥打码 */
        .mask-wrap { display: inline-flex; align-items: center; gap: 6px; }
        .mask-txt { font-variant-numeric: tabular-nums; min-width: 18ch; }
        .mask-toggle {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border: none; background: transparent;
            color: var(--c-text-3); cursor: pointer; border-radius: 5px; padding: 0; flex-shrink: 0;
        }
        .mask-toggle:hover { background: #f1f3f5; color: var(--c-text-2); }
        .mask-toggle .ico {
            width: 14px; height: 14px; stroke: currentColor; fill: none;
            stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
        }
        /* 头像上传与显示（与 drivers.html 同一套） */
        .avatar-upload { display: flex; align-items: center; gap: 10px; }
        .avatar-box {
            width: 56px; height: 56px; border-radius: 50%;
            border: 1px solid var(--c-border); background: #f7f8fa;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-shrink: 0;
            color: var(--c-text-3); font-size: 12px;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-img {
            width: 26px; height: 26px; border-radius: 50%;
            overflow: hidden; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .avatar-img img { width: 100%; height: 100%; object-fit: cover; }
        /* 有头像时：头像右下角叠性别角标 */
        .avatar-wrap { position: relative; display: inline-flex; flex-shrink: 0; }
        .gender-badge {
            position: absolute;
            right: -3px; bottom: -3px;
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .gender-badge svg {
            width: 8px; height: 8px;
            fill: none; stroke: currentColor;
            stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
        }
        /* 头像悬浮大图预览浮层 */
        .avatar-float {
            position: fixed;
            z-index: 300;
            pointer-events: none;
            width: 120px; height: 120px;
            padding: 3px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(16, 24, 40, .22);
        }
        .avatar-float img { width: 100%; height: 100%; object-fit: cover; border-radius: 9px; }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
        <div class="page">

            <div class="page-head">
                <div>
                    <div class="crumbs" data-auto-crumbs></div>
                    <h1 class="page-title">车长管理</h1>
                </div>
                <div class="page-actions">
                    <label class="search-wrap">
                        <svg class="ico" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.4"/><path d="M13 13l3.4 3.4"/></svg>
                        <input type="text" class="search" id="searchInput" placeholder="搜索姓名 / 电话…" style="width:220px">
                    </label>
                    <button class="btn btn-primary" id="btnAdd">
                        <svg class="ico" viewBox="0 0 20 20"><path d="M10 4.2v11.6M4.2 10h11.6"/></svg>
                        新增车长
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="table-wrap">
                    <table class="tbl">
                        <thead>
                        <tr>
                            <th>姓名</th>
                            <th>电话</th>
                            <th>身份证号</th>
                            <th class="col-actions">操作</th>
                        </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="modal" class="modal-mask" style="display:none">
    <div class="modal">
        <h3 id="modalTitle">新增车长</h3>
        <div class="field">
            <label>头像</label>
            <div class="avatar-upload">
                <div class="avatar-box" id="avatarBox">无头像</div>
                <button type="button" class="btn btn-sm" id="btnAvatar">上传头像</button>
                <button type="button" class="btn btn-sm" id="btnAvatarClear" style="display:none">移除</button>
                <input type="file" id="avatarFile" accept="image/*" style="display:none">
                <input type="hidden" id="fAvatar">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>姓名<span class="req">*</span></label>
                <input type="text" class="input" id="fName" maxlength="50" placeholder="如 刘哲">
            </div>
            <div class="field">
                <label>性别</label>
                <select class="select" id="fGender">
                    <option value="">未填写</option>
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
        </div>
        <div class="field">
            <label>电话</label>
            <input type="text" class="input" id="fPhone" maxlength="20" placeholder="11 位手机号">
        </div>
        <div class="field">
            <label>身份证号</label>
            <input type="text" class="input" id="fIdCard" maxlength="18" placeholder="18 位身份证号">
        </div>
        <div class="btn-row">
            <button class="btn" id="btnCancel">取消</button>
            <button class="btn btn-primary" id="btnSave">保存</button>
        </div>
    </div>
</div>

<div id="avatarFloat" class="avatar-float" style="display:none"></div>
<div id="toast"></div>
<script src="js/map-common.js"></script>
<script src="js/layout.js"></script>
<script>
    initShell();

    let captains = [];
    let editingId = null;

    const GENDER_SVG = {
        male: '<svg viewBox="0 0 24 24"><circle cx="10" cy="14" r="5.5"/><path d="M14.5 9.5L19 5M19 5h-4M19 5v4"/></svg>',
        female: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5.5"/><path d="M12 13.5V20M9 17h6"/></svg>'
    };

    function genderIcon(g) {
        if (g === '男') return '<span class="gender-ico gender-m" title="男">' + GENDER_SVG.male + '</span>';
        if (g === '女') return '<span class="gender-ico gender-f" title="女">' + GENDER_SVG.female + '</span>';
        return '<span class="gender-ico gender-none" title="未填写">—</span>';
    }

    function genderBadge(g) {
        if (g === '男') return '<span class="gender-badge gender-m" title="男">' + GENDER_SVG.male + '</span>';
        if (g === '女') return '<span class="gender-badge gender-f" title="女">' + GENDER_SVG.female + '</span>';
        return '';
    }

    function captainAvatar(c) {
        if (c.avatarUrl) {
            return '<span class="avatar-wrap">' +
                '<span class="avatar-img"><img src="' + esc(c.avatarUrl) + '" alt=""></span>' +
                genderBadge(c.gender) +
                '</span>';
        }
        return genderIcon(c.gender);
    }

    function maskText(s) {
        const n = s.length;
        if (n <= 4) return '****';
        let front, back;
        if (n >= 16) { front = 6; back = 4; }
        else if (n >= 10) { front = 4; back = 4; }
        else if (n >= 7) { front = 3; back = 3; }
        else { front = 2; back = 2; }
        const stars = Math.min(4, n - front - back);
        return s.slice(0, front) + '*'.repeat(stars) + s.slice(-back);
    }

    function maskedCell(v) {
        const eyeSvg = '<svg class="ico" viewBox="0 0 20 20"><path d="M1.8 10S5.2 5 10 5s8.2 5 8.2 5-3.4 5-8.2 5-8.2-5-8.2-5z"/><circle cx="10" cy="10" r="2.6"/></svg>';
        if (!v) {
            return '<span class="mask-wrap"><span class="mask-txt mono muted">—</span>' +
                '<span class="mask-toggle" aria-hidden="true" style="visibility:hidden">' + eyeSvg + '</span></span>';
        }
        return '<span class="mask-wrap"><span class="mask-txt mono">' + esc(maskText(v)) + '</span>' +
            '<button type="button" class="mask-toggle" data-full="' + esc(v) + '" title="显示/隐藏">' + eyeSvg + '</button></span>';
    }

    async function load() {
        try {
            captains = await api('/api/captains') || [];
            render();
            locate();
        } catch (err) { toast('加载失败：' + err.message, true); }
    }

    function locate() {
        const pk = new URLSearchParams(location.search).get('pk');
        if (!pk) return;
        const tr = document.querySelector('tr[data-id="' + pk + '"]');
        if (tr) {
            tr.scrollIntoView({ block: 'center' });
            tr.classList.add('row-flash');
        }
    }

    function render() {
        const kw = $('searchInput').value.trim().toLowerCase();
        const list = captains.filter(c => !kw ||
            (c.name || '').toLowerCase().includes(kw) || (c.phone || '').toLowerCase().includes(kw));
        const tbody = $('tbody');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state">' +
                '<div class="em-title">没有匹配的车长</div>' +
                '<div class="em-desc">点击右上角「新增车长」创建</div></div></td></tr>';
            return;
        }
        tbody.innerHTML = list.map(c =>
            '<tr data-id="' + c.id + '">' +
            '<td class="strong">' + captainAvatar(c) + esc(c.name || '—') + '</td>' +
            '<td class="mono">' + (c.phone ? esc(c.phone) : '<span class="muted">—</span>') + '</td>' +
            '<td>' + maskedCell(c.idCardNumber) + '</td>' +
            '<td class="col-actions">' +
            '<button class="btn btn-sm" data-edit="' + c.id + '">编辑</button> ' +
            '<button class="btn btn-sm btn-danger" data-del="' + c.id + '">删除</button></td>' +
            '</tr>'
        ).join('');
        tbody.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openModal(parseInt(b.dataset.edit))));
        tbody.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => remove(parseInt(b.dataset.del))));
    }

    function openModal(id) {
        editingId = id || null;
        $('modalTitle').textContent = id ? '编辑车长' : '新增车长';
        const c = id ? captains.find(x => x.id === id) : null;
        $('fName').value = c ? (c.name || '') : '';
        $('fGender').value = c ? (c.gender || '') : '';
        $('fPhone').value = c ? (c.phone || '') : '';
        $('fIdCard').value = c ? (c.idCardNumber || '') : '';
        renderAvatarBox(c ? c.avatarUrl : null);
        $('modal').style.display = '';
        $('fName').focus();
    }

    function renderAvatarBox(url) {
        $('fAvatar').value = url || '';
        const box = $('avatarBox');
        if (url) {
            box.innerHTML = '<img src="' + esc(url) + '" alt="">';
            $('btnAvatarClear').style.display = '';
        } else {
            box.textContent = '无头像';
            $('btnAvatarClear').style.display = 'none';
        }
    }

    function closeModal() { $('modal').style.display = 'none'; }

    async function save() {
        const name = $('fName').value.trim();
        const phone = $('fPhone').value.trim() || null;
        const gender = $('fGender').value || null;
        const idCard = $('fIdCard').value.trim() || null;
        if (!name) { toast('姓名不能为空', true); return; }
        if (idCard && !/^\d{17}[\dXx]$/.test(idCard)) { toast('身份证号格式不正确（应为 18 位，末位可为 X）', true); return; }
        const body = { name: name, phone: phone, gender: gender, idCardNumber: idCard, avatarUrl: $('fAvatar').value || null };
        try {
            if (editingId) {
                await api('/api/captains/' + editingId, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已更新：' + name);
            } else {
                await api('/api/captains', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                toast('已新增：' + name);
            }
            closeModal();
            await load();
        } catch (err) { toast('保存失败：' + err.message, true); }
    }

    async function remove(id) {
        const c = captains.find(x => x.id === id);
        if (!c) return;
        if (!confirm('确定删除车长「' + (c.name || '') + '」？此操作不可恢复。')) return;
        try {
            await api('/api/captains/' + id, { method: 'DELETE' });
            toast('已删除：' + c.name);
            await load();
        } catch (err) { toast('删除失败：' + err.message, true); }
    }

    $('searchInput').addEventListener('input', render);
    $('tbody').addEventListener('click', e => {
        const t = e.target.closest('.mask-toggle');
        if (!t) return;
        const txt = t.parentElement.querySelector('.mask-txt');
        const showing = t.dataset.showing === '1';
        txt.textContent = showing ? maskText(t.dataset.full) : t.dataset.full;
        t.dataset.showing = showing ? '0' : '1';
    });
    $('btnAdd').addEventListener('click', () => openModal(null));
    $('btnCancel').addEventListener('click', closeModal);
    $('btnSave').addEventListener('click', save);
    $('btnAvatar').addEventListener('click', () => $('avatarFile').click());
    $('avatarFile').addEventListener('change', async () => {
        const file = $('avatarFile').files[0];
        if (!file) return;
        const fd = new FormData();
        fd.append('file', file);
        fd.append('dir', 'avatars');
        try {
            const res = await api('/api/upload', { method: 'POST', body: fd });
            renderAvatarBox(res.url);
            toast('头像已上传');
        } catch (err) { toast('上传失败：' + err.message, true); }
    });
    $('btnAvatarClear').addEventListener('click', () => renderAvatarBox(null));
    $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').style.display !== 'none') closeModal(); });

    // 头像悬浮大图预览（事件委托，悬停 400ms 后才显示，避免划过误触）
    const floatEl = $('avatarFloat');
    let showTimer = null, hideTimer = null;
    function hideFloat() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { floatEl.style.display = 'none'; }, 120);
    }
    $('tbody').addEventListener('mouseover', e => {
        const img = e.target.closest('.avatar-img img');
        if (!img) return;
        clearTimeout(hideTimer);
        clearTimeout(showTimer);
        const src = img.getAttribute('src');
        const r = img.getBoundingClientRect();
        showTimer = setTimeout(() => {
            floatEl.innerHTML = '<img src="' + esc(src) + '" alt="">';
            let left = r.right + 8, top = r.top + r.height / 2 - 60;
            if (left + 126 > window.innerWidth) left = r.left - 128;
            floatEl.style.left = left + 'px';
            floatEl.style.top = top + 'px';
            floatEl.style.display = '';
        }, 400);
    });
    $('tbody').addEventListener('mouseout', e => {
        if (!e.target.closest('.avatar-img img')) return;
        clearTimeout(showTimer);
        hideFloat();
    });

    load();
</script>
</body>
</html>
